entsoe:
  api_key: ""        # ENTSO-E security token (required)
  area: "FI"         # Bidding zone — short code (FI, SE1–SE4, NO1–NO5, DK1/2, EE, LV, LT, DE, FR, NL, BE, AT, PL)
                     # or full EIC code, e.g. "10YFI-1--------U"

charging:
  required_hours: 4          # Total hours of charging to schedule
  contiguous_only: false     # true = one unbroken block; false = cheapest individual slots (may be split)
  min_slot_minutes: 30       # Minimum contiguous block length (must be divisible by 15)
  max_price_cents_kwh: null  # Price ceiling in c€/kWh — skip slots above this (null = no limit)
  preferred_window_start: "00:00"  # Start of preferred charging window (required, HH:MM, 00:00–23:59)
  preferred_window_end: "07:00"    # End of preferred charging window (required, must be after start)
                                   # Slots outside the window are used only if needed to meet required_hours
  timezone: "Europe/Helsinki"      # IANA timezone name (null = auto-detect from system)

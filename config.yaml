# Charging Planner configuration
#

entsoe:
  api_key: ""        # ENTSO-E security token — never commit a real key here; injected at runtime by GitHub Actions
  area: "FI"         # Bidding zone — short code (FI, SE1–SE4, NO1–NO5, DK1/2, EE, LV, LT, DE, FR, NL, BE, AT, PL)
                     # or full EIC code, e.g. "10YFI-1--------U"

charging:
  - name: "topup"
    required_hours: 2                   # Total hours of charging to schedule
    continuous_only: false              # Cheapest individual slots (may be split across the window)
    min_slot_minutes: 30                # Minimum continuous block length (must be divisible by 15)
    max_price_cents_kwh: null           # Price ceiling in c€/kWh — skip slots above this (null = no limit)
    preferred_window_start: "22:00"
    preferred_window_end: "06:30"
    timezone: "Europe/Helsinki"

  - name: "overnight"
    required_hours: 6                   # Total hours of charging to schedule
    continuous_only: true               # One unbroken block, extended leftward if window is too short
    min_slot_minutes: 30
    max_price_cents_kwh: null
    preferred_window_start: "22:00"     # Overnight window — wraps midnight
    preferred_window_end: "06:30"
    timezone: "Europe/Helsinki"

ntfy:
  enabled: true
  topic: ""    # never commit — injected at runtime via NTFY_TOPIC environment variable

# Charger delivery configuration
#

deliveries:
  - profile: "topup"
    charge_point_id_env: "CHARGER_ID_1"   # env var holding the charger ID
    connector_id: 1
    max_current: 16.0
    timezone: "Europe/Helsinki"


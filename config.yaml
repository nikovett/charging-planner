# Charging Planner configuration
#

entsoe:
  api_key: ""        # ENTSO-E security token — never commit a real key here; injected at runtime by GitHub Actions
  area: FI           # Bidding zone — short code (FI, SE1–SE4, NO1–NO5, DK1/2, EE, LV, LT, DE, FR, NL, BE, AT, PL)
                     # or full EIC code, e.g. 10YFI-1--------U
  timezone: Europe/Helsinki  # IANA timezone — applies to all charging profiles

charging:
  - name: topup
    required_hours: 2                   # Total hours of charging to schedule
    continuous_only: false              # Cheapest individual slots (may be split across the window)
    min_slot_minutes: 30                # Minimum continuous block length (must be divisible by 15)
    min_gap_minutes: 15                 # Minimum gap between charging blocks (must be divisible by 15, 0 = no gap constraint)
    max_price_cents_kwh: avg            # Price ceiling in c€/kWh — skip slots above this (null = no limit, "avg" = daily market average)
    preferred_window_start: "21:00"     # Quoted — would parse as 22 minutes without quotes
    preferred_window_end: "06:30"
    schedule:                           # Optional: day-specific overrides for window and/or required hours
                                        # Each entry describes the window for that target day.
                                        # Overnight windows (21:00–06:30) start the evening before.
      - days: [monday, tuesday, wednesday, thursday, friday]
        preferred_window_start: "21:00"
        preferred_window_end: "06:30"
        required_hours: 1.5             # Optional: override required_hours for these days
      - days: [saturday, sunday]
        preferred_window_start: any     # any + any = no window constraint — pick cheapest slots from all available prices
        preferred_window_end: any
        required_hours: 4.5             # Optional: longer charge on weekends
    deliveries:
      - handler: chargeamps             # → delivery/deliver_chargeamps.py
        enabled: true
        charge_point_id: CHARGER_ID_1   # single ID, or a list: [CHARGER_ID_1, CHARGER_ID_2]
        connector_id: 1                 # typically 1 = type2, 2 = schuko, unless Aura
    #   charging_rate_unit: A           # Charge Amps API accepts only current (A) so no need to configure it here, just an example
        max_charging_rate: 16.0         # amps
        restore_mode: true              # Charge Amps only: delivered schedule always changes the charger mode to "Schedule". Enabling this restores charging mode back to what it was before delivery.

  - name: overnight
    required_hours: 3.5                 # Total hours of charging to schedule
    continuous_only: true               # One unbroken block, extended leftward if window is too short
    min_slot_minutes: 30
    min_gap_minutes: 15                 # Minimum gap between charging blocks (must be divisible by 15, 0 = no gap constraint)
    max_price_cents_kwh: null           # null = no limit, "avg" = daily market average
    preferred_window_start: "21:00"     # Overnight window — wraps midnight
    preferred_window_end: "06:30"
    schedule:                           # Optional: day-specific window overrides
                                        # Each entry describes the window for that target day.
                                        # Overnight windows (21:00–06:30) start the evening before.
      - days: [monday, tuesday, wednesday, thursday, friday]
        preferred_window_start: "21:00"
        preferred_window_end: "06:30"
      - days: [saturday, sunday]
        preferred_window_start: any     # any + any = no window constraint — pick cheapest slots from all available prices
        preferred_window_end: any
    deliveries:
      - handler: chargeamps             # → delivery/deliver_chargeamps.py
        enabled: false                  # configured but set to false to temporarily disable this delivery
        charge_point_id: CHARGER_ID_2   # single ID, or a list: [CHARGER_ID_1, CHARGER_ID_2]
        connector_id: 1
    #   charging_rate_unit: A           # Charge Amps API accepts only current (A) so no need to configure it here, just an example
        max_charging_rate: 16.0         # amps
        restore_mode: true              # Charge Amps only: delivered schedule always changes the charger mode to "Schedule". Enabling this restores charging mode back to what it was before delivery.

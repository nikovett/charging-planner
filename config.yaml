# Charging Planner configuration
#

entsoe:
  api_key: ""        # ENTSO-E security token — never commit a real key here; injected at runtime by GitHub Actions
  area: FI           # Bidding zone — short code (FI, SE1–SE4, NO1–NO5, DK1/2, EE, LV, LT, DE, FR, NL, BE, AT, PL)
                     # or full EIC code, e.g. 10YFI-1--------U
  timezone: Europe/Helsinki  # IANA timezone — applies to all charging profiles

charging:
  - name: topup
    required_hours: 3                   # Total hours of charging to schedule
    continuous_only: false              # Cheapest individual slots (may be split across the window)
    min_slot_minutes: 30                # Minimum continuous block length (must be divisible by 15)
    max_price_cents_kwh: null           # Price ceiling in c€/kWh — skip slots above this (null = no limit)
    preferred_window_start: "22:00"     # Quoted — would parse as 22 minutes without quotes
    preferred_window_end: "06:30"
    deliveries:
      - handler: chargeamps             # → delivery/deliver_chargeamps.py
        charge_point_id_env: CHARGER_ID_1   # single ID, or a list: [CHARGER_ID_1, CHARGER_ID_2]
        connector_id: 1           # typically 1 = type2, 2 = schuko, unless Aura
    #   charging_rate_unit: A         # Charge Amps API accepts only current (A) so no need to configure it here, just an example
        max_charging_rate: 16.0        # amps

  - name: overnight
    required_hours: 5                   # Total hours of charging to schedule
    continuous_only: true               # One unbroken block, extended leftward if window is too short
    min_slot_minutes: 30
    max_price_cents_kwh: null
    preferred_window_start: "21:00"     # Overnight window — wraps midnight
    preferred_window_end: "06:30"
    deliveries:
      - handler: chargeamps             # → delivery/deliver_chargeamps.py
        charge_point_id_env: CHARGER_ID_2   # single ID, or a list: [CHARGER_ID_1, CHARGER_ID_2]
        connector_id: 1
    #   charging_rate_unit: A         # Charge Amps API accepts only current (A) so no need to configure it here, just an example
        max_charging_rate: 16.0        # amps
        enabled: false                 # configured but set to false to temporarily disable this delivery

    # Example: deliver overnight profile to two chargers via different handlers
    #
    # deliveries:
    #   - handler: chargeamps
    #     charge_point_id_env:          # list — same plan delivered to both chargers
    #       - CHARGER_ID_1
    #       - CHARGER_ID_2
    #     connector_id: 1
    #     max_charging_rate: 16.0      # amps — Charge Amps API uses current (A)
    #
    #   - handler: ocpp                # → delivery/deliver_ocpp.py
    #     charge_point_id_env: CHARGER_ID_2   # reuse same CHARGER_ID_# scheme
    #     endpoint_url_env: OCPP_ENDPOINT_URL  # e.g. ws://192.168.1.10:9000/ocpp
    #     ocpp_version: "1.6"          # Quoted — would parse as float without quotes
    #     connector_id: 1              # OCPP 1.6 connectorId / 2.x evseId — default 1
    #     transaction_id: null         # omit or null for TxDefaultProfile
    #     timeout: 30                  # seconds to wait for response — default 30
    #     charging_rate_unit: W        # unit for max_charging_rate: W (power in watts) or A (current in amps per phase) — check your charger's OCPP documentation
    #     max_charging_rate: 11000.0   # limit in W or A during charging windows — default 11000.0
    #     profile_id: 1                # ChargingProfile identifier, must be unique on the charger — default 1
    #     stack_level: 0               # higher values take precedence; 0 = lowest priority — default 0

ntfy:
  enabled: true
  topic: ""    # never commit — injected at runtime via NTFY_TOPIC environment variable

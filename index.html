<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>charging-planner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0a0a0a;
    --bg2:       #111111;
    --bg3:       #1a1a1a;
    --border:    #222222;
    --border2:   #2e2e2e;
    --text:      #e8e8e8;
    --muted:     #666666;
    --dim:       #444444;
    --accent:    #00d4a0;
    --accent2:   #00a07a;
    --warn:      #f59e0b;
    --danger:    #ef4444;
    --mono:      'IBM Plex Mono', monospace;
    --sans:      'IBM Plex Sans', sans-serif;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── Layout ── */
  .shell {
    max-width: 860px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 0 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
  }
  .logo {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.08em;
  }
  .logo span { color: var(--muted); }
  .header-meta {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    text-align: right;
  }
  /* ── Section label ── */
  .section-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  /* ── Profile cards ── */
  .profiles { display: flex; flex-direction: column; gap: 24px; margin-bottom: 40px; }

  .profile-card {
    opacity: 0;
    transform: translateY(12px);
    animation: fadeUp 0.4s ease forwards;
  }
  .profile-card:nth-child(2) { animation-delay: 0.08s; }
  .profile-card:nth-child(3) { animation-delay: 0.16s; }
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .card-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
  }
  .profile-name {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    letter-spacing: 0.04em;
  }
  .profile-date {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }

  /* ── Flip card ── */
  .flip-card {
    perspective: 1200px;
    -webkit-perspective: 1200px;
    cursor: pointer;
  }
  .flip-card-inner {
    position: relative;
    transition: transform 0.55s cubic-bezier(0.4, 0.2, 0.2, 1);
    transform-style: preserve-3d;
    border: 1px solid var(--border);
    border-radius: 2px;
  }
  .flip-card.flipped .flip-card-inner {
    transform: rotateY(180deg);
  }
  .flip-card.flipped .flip-card-front {
    visibility: hidden;
  }
  .flip-card-front,
  .flip-card-back {
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: var(--bg2);
    border-radius: 2px;
    overflow: hidden;
    transform: translateZ(0);
    -webkit-transform: translateZ(0);
  }
  .flip-card-front {
    position: relative;
  }
  .flip-card-back {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    width: 100%;
    box-sizing: border-box;
    transform: rotateY(180deg);
    overflow-y: auto;
    visibility: hidden;
    background: var(--bg2);
  }
  .flip-card.flipped .flip-card-back {
    visibility: visible;
  }
  .flip-card-back-inner {
    padding: 20px;
    overflow: hidden;
  }
  .flip-hint {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--dim);
    position: absolute;
    bottom: 8px;
    right: 12px;
    letter-spacing: 0.06em;
  }
  .back-title {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .back-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 12px;
  }
  .back-row:last-child { border-bottom: none; }
  .back-key { color: var(--muted); }
  .back-val { color: var(--text); text-align: right; }

  /* ── Stats row ── */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-bottom: 1px solid var(--border);
    gap: 1px;
    background: var(--border);
  }
  .stat {
    padding: 14px 20px;
    background: var(--bg2);
  }
  .stat-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .stat-value {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.2;
  }
  .stat-value.good { color: var(--accent); }
  .stat-value.warn { color: var(--warn); }
  .stat-unit {
    font-size: 10px;
    color: var(--muted);
    margin-left: 2px;
  }

  /* ── Timeline ── */
  .timeline-wrap { padding: 16px 20px 0; }
  .timeline-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .timeline {
    position: relative;
    height: 36px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .timeline-window {
    position: absolute;
    top: 0; bottom: 0;
    background: var(--accent);
    opacity: 0.15;
  }
  .timeline-slot {
    position: absolute;
    top: 0; bottom: 0;
    background: var(--accent);
    border-radius: 1px;
  }
  .timeline-now {
    position: absolute;
    top: 0; bottom: 0;
    width: 1px;
    background: var(--warn);
    opacity: 0.6;
  }
  .timeline-ticks {
    display: flex;
    justify-content: space-between;
    padding: 0 2px;
  }
  .tick {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--muted);
  }

  /* ── Windows list ── */
  .windows-list {
    padding: 12px 20px 12px;
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 8px;
  }
  .window-row {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 11px;
    border: 1px solid var(--border2);
    border-radius: 2px;
    padding: 4px 10px;
    align-self: flex-start;
  }
  .window-time { color: var(--text); }
  .window-price { color: var(--accent); }
  .window-dur { color: var(--muted); }

  /* ── Market bar ── */
  .market-bar-wrap { padding: 0 20px 20px; }
  .market-bar {
    height: 4px;
    background: var(--bg3);
    border-radius: 2px;
    position: relative;
    margin-top: 8px;
  }
  .market-bar-fill {
    height: 100%;
    background: var(--border2);
    border-radius: 2px;
    width: 100%;
  }
  .market-bar-avg {
    position: absolute;
    top: -2px;
    width: 2px;
    height: 8px;
    background: var(--muted);
    border-radius: 1px;
  }
  .market-bar-plan {
    position: absolute;
    top: -2px;
    width: 2px;
    height: 8px;
    background: var(--accent);
    border-radius: 1px;
  }
  .market-bar-labels {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
  }
  .market-bar-labels .plan-label { color: var(--accent); }

  /* ── Config view ── */
  .config-section { margin-bottom: 40px; }
  .schedule-grid {
    background: var(--border);  /* shows through gaps as dividers */
    border: 1px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
    width: 100%;
    box-sizing: border-box;
  }
  .schedule-header {
    display: grid;
    grid-template-columns: minmax(40px, 64px) repeat(7, 1fr);
    border-bottom: 1px solid var(--border);
    gap: 1px;
    background: var(--border);
  }
  .day-label {
    padding: 8px 0;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    text-align: center;
    letter-spacing: 0.06em;
    background: var(--bg2);
  }
  .day-label.today { color: var(--accent); }
  .schedule-row {
    display: grid;
    grid-template-columns: minmax(40px, 64px) repeat(7, 1fr);
    gap: 1px;
    background: var(--border);
    border-bottom: 1px solid var(--border);
    min-height: 28px;
  }
  .schedule-row:last-child { border-bottom: none; }
  .row-label {
    padding: 6px 10px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    display: flex;
    align-items: center;
    background: var(--bg2);
  }
  .day-cell {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg2);
    overflow: hidden;
  }
  .day-cell.has-window {
    background: rgba(0, 212, 160, 0.08);
  }
  .day-cell.any-window {
    background: rgba(0, 212, 160, 0.04);
  }
  .cell-text {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--accent);
    text-align: center;
    padding: 2px 4px;
    line-height: 1.4;
  }
  .cell-text.any { color: var(--accent2); }

  /* ── Profile config table ── */
  .config-table {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
    width: 100%;
    border-collapse: collapse;
  }
  .config-table th {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 8px 14px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
    white-space: nowrap;
  }
  .config-table th:last-child { border-right: none; }
  .config-table td {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text);
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
    vertical-align: middle;
  }
  .config-table td:last-child { border-right: none; }
  .config-table tr:last-child td { border-bottom: none; }
  .pill {
    display: inline-block;
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 2px;
    border: 1px solid var(--border2);
    color: var(--muted);
    margin-right: 3px;
    white-space: nowrap;
  }
  .pill.on { border-color: var(--accent2); color: var(--accent); }

  /* ── Footer ── */
  footer {
    border-top: 1px solid var(--border);
    padding-top: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .footer-text {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--dim);
  }
  .footer-link {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    text-decoration: none;
  }
  .footer-link:hover { color: var(--accent); }

  /* ── Loading / empty ── */
  .loading {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    padding: 40px 0;
    text-align: center;
  }

  @media (max-width: 600px) {
    .stats-row { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="shell">

  <header>
    <div class="logo">charging<span>-</span>planner</div>
    <div class="header-meta">
      <div id="run-time">—</div>
    </div>
  </header>

  <!-- Plans -->
  <div class="section-label">latest plans</div>
  <div class="profiles" id="profiles">
    <div class="loading">loading plans…</div>
  </div>

  <!-- Config -->


  <footer>
    <span class="footer-text">charging-planner · ENTSO-E day-ahead prices</span>
    <a class="footer-link" href="https://github.com" id="repo-link">view repository →</a>
  </footer>

</div>

<script>
// Profile config map populated when config.yaml is loaded
var PROFILE_CONFIG = {};
// Plan data map populated when JSONs are loaded
var PLAN_DATA = {};

// ── Helpers ───────────────────────────────────────────────────────────────
function hhmm(str) {
  if (!str || str === "any") return null;
  const parts = str.split(":");
  return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
}

function fmtDuration(minutes) {
  const h = Math.floor(minutes / 60);
  const m = minutes % 60;
  return m === 0 ? h + "h" : h + "h" + String(m).padStart(2, "0") + "m";
}

function savings(plan) {
  const avg = plan.price_stats.avg_cents_kwh;
  if (!avg) return null;
  return (1 - plan.avg_price_cents_kwh / avg) * 100;
}

// ── Rendering ─────────────────────────────────────────────────────────────
function renderTimeline(plan) {
  var slots = plan.price_slots;
  if (!slots || !slots.length) return renderTimelineLegacy(plan);

  var utcOffset = (plan.utc_offset_hours || 0) * 60;
  // Use plan-level price stats for consistent Y scaling across all slots
  var minP = plan.price_stats ? plan.price_stats.min_cents_kwh : Math.min.apply(null, slots.map(function(s){return s.price_cents_kwh;}));
  var maxP = plan.price_stats ? plan.price_stats.max_cents_kwh : Math.max.apply(null, slots.map(function(s){return s.price_cents_kwh;}));
  var rangeP = maxP - minP || 1;

  // 24h window centered on charging midpoint
  var rangeStart, rangeEnd;
  var firstSlotMins = new Date(slots[0].start_utc).getTime() / 60000 + utcOffset;
  if (plan.window_starts_utc && plan.window_starts_utc.length) {
    var wsUtc = new Date(plan.window_starts_utc[0]).getTime() + utcOffset * 60000;
    var weUtc = new Date(plan.window_ends_utc[plan.window_ends_utc.length-1]).getTime() + utcOffset * 60000;
    var midMs = (wsUtc + weUtc) / 2;
    rangeStart = Math.round(midMs / 60000) - 12 * 60;
    rangeEnd   = rangeStart + 24 * 60;
    // Clamp rangeStart to first available slot so bars don't float with empty space on left
    rangeStart = Math.max(rangeStart, firstSlotMins);
  } else {
    rangeStart = firstSlotMins;
    rangeEnd   = rangeStart + 24 * 60;
  }
  var totalMins = rangeEnd - rangeStart;

  // Filter to display range
  var visible = slots.filter(function(s) {
    var lm = new Date(s.start_utc).getTime() / 60000 + utcOffset;
    return lm >= rangeStart && lm < rangeEnd;
  });
  if (!visible.length) visible = slots;

  var n = visible.length;
  var gapPx = 1;
  var slotWidthPct = (15 / totalMins * 100).toFixed(4); // each 15-min slot as % of total range

  // Min/max slot indices
  // Find min/max within visible slots (may differ from plan stats if some slots are outside range)
  var minIdx = 0, maxIdx = 0;
  for (var i = 1; i < visible.length; i++) {
    if (visible[i].price_cents_kwh < visible[minIdx].price_cents_kwh) minIdx = i;
    if (visible[i].price_cents_kwh > visible[maxIdx].price_cents_kwh) maxIdx = i;
  }

  // Bars — positioned by actual timestamp so "now" line, ticks, and bars all align
  var nowMins = new Date().getTime() / 60000 + utcOffset;
  var nowSlot = null;
  for (var ni = 0; ni < visible.length; ni++) {
    var slotMins0 = new Date(visible[ni].start_utc).getTime() / 60000 + utcOffset;
    if (slotMins0 <= nowMins && nowMins < slotMins0 + 15) { nowSlot = visible[ni]; break; }
  }

  var barsHTML = '<div style="position:absolute;left:0;right:0;top:0;bottom:0;">'
  + visible.map(function(s, i) {
    var lm = new Date(s.start_utc).getTime() / 60000 + utcOffset;
    var leftPct = ((lm - rangeStart) / totalMins * 100).toFixed(4);
    var h = (25 + ((s.price_cents_kwh - minP) / rangeP * 63)).toFixed(1);
    var isMin = i === minIdx, isMax = i === maxIdx;
    var isNow = nowSlot && s.start_utc === nowSlot.start_utc;
    var isCharging = s.charging;
    var isForecasted = !!s.forecasted;
    var bg, border;
    if (isCharging) {
      bg = "var(--accent)"; border = "border-top:1px solid var(--accent2);";
    } else if (isForecasted) {
      bg = "repeating-linear-gradient(45deg,var(--dim) 0px,var(--dim) 2px,var(--bg3) 2px,var(--bg3) 4px)";
      border = "border-top:1px solid var(--border2);";
    } else {
      bg = "var(--dim)"; border = "border-top:1px solid var(--border2);";
    }
    var hh = Math.floor(((lm % (24*60)) + 24*60) % (24*60) / 60);
    var mm = Math.floor(((lm % (24*60)) + 24*60) % (24*60) % 60);
    var tip = String(hh).padStart(2,"0") + ":" + String(mm).padStart(2,"0") + "  " + s.price_cents_kwh.toFixed(2) + " c\u20ac/kWh" + (isCharging ? "  \u26a1" : "") + (isForecasted ? "  (forecast)" : "");

    // Min label: teal on grey bar, grey on teal bar; rotated inside bar at top
    // Only show if bar is wide enough — skip on narrow mobile viewports
    var annotation = "";
    var barWidthPx = parseFloat(slotWidthPct) / 100 * (window.innerWidth || 800);
    var showLabel = barWidthPx >= 8;
    if (showLabel) {
      if (isMin) {
        var minColor = isCharging ? "var(--muted)" : "var(--accent)";
        annotation = '<div style="position:absolute;top:2px;left:0;right:0;display:flex;align-items:center;justify-content:flex-start;writing-mode:vertical-rl;text-orientation:mixed;transform:rotate(180deg);font-family:var(--mono);font-size:7px;color:' + minColor + ';white-space:nowrap;line-height:1;pointer-events:none">' + s.price_cents_kwh.toFixed(2) + '</div>';
      }
      if (isMax) {
        annotation = '<div style="position:absolute;top:2px;left:0;right:0;display:flex;align-items:center;justify-content:flex-start;writing-mode:vertical-rl;text-orientation:mixed;transform:rotate(180deg);font-family:var(--mono);font-size:7px;color:var(--warn);white-space:nowrap;line-height:1;pointer-events:none">' + s.price_cents_kwh.toFixed(2) + '</div>';
      }
      // Now price inside bar — skip if this bar already has min/max label
      if (isNow && !isMin && !isMax) {
        var nowLabelColor = isCharging ? "var(--muted)" : "var(--accent)";
        annotation = '<div style="position:absolute;top:2px;left:0;right:0;display:flex;align-items:center;justify-content:flex-start;writing-mode:vertical-rl;text-orientation:mixed;transform:rotate(180deg);font-family:var(--mono);font-size:7px;color:' + nowLabelColor + ';white-space:nowrap;line-height:1;pointer-events:none">' + s.price_cents_kwh.toFixed(2) + '</div>';
      }
    }

    return '<div title="' + tip + '" style="position:absolute;left:' + leftPct + '%;bottom:0;width:calc(' + slotWidthPct + '% - ' + gapPx + 'px);height:' + h + '%;background:' + bg + ';' + border + 'box-sizing:border-box;border-radius:2px 2px 0 0;overflow:hidden">' + annotation + '</div>';
  }).join("") + '</div>';

  // "Now" separator — current time position on histogram
  var midnightHTML = "";
  if (nowMins >= rangeStart && nowMins < rangeEnd) {
    var nowPct = ((nowMins - rangeStart) / totalMins * 100).toFixed(2);
    var nowBarH = nowSlot ? (25 + ((nowSlot.price_cents_kwh - minP) / rangeP * 63)) : 50;
    var lineTopPct = (100 - nowBarH).toFixed(1);
    var arrowTop = 'calc(' + lineTopPct + '% - 6px)';
    var lineH = 'calc(' + lineTopPct + '% - 8px)';
    midnightHTML = '<div style="position:absolute;left:' + nowPct + '%;top:2px;height:' + lineH + ';width:1px;background:var(--accent);opacity:0.9;z-index:2;pointer-events:none;transform:translateX(-50%)"></div>'
                 + '<svg style="position:absolute;left:' + nowPct + '%;top:' + arrowTop + ';transform:translateX(-50%);overflow:visible;z-index:3;pointer-events:none" width="' + Math.max(4, Math.round(600/n*0.75)) + 'px" height="5" viewBox="0 0 10 5" preserveAspectRatio="none"><polygon points="5,5 0,0 10,0" fill="var(--accent)" opacity="0.9"/></svg>'
                 + '<span style="position:absolute;left:' + nowPct + '%;top:3px;transform:translateX(-100%);padding-right:3px;font-family:var(--mono);font-size:7px;color:var(--accent);white-space:nowrap;z-index:3;line-height:1">now</span>';
  }

  // Market average horizontal dashed line
  var avgP = plan.price_stats ? plan.price_stats.avg_cents_kwh : null;
  var marketLineHTML = "";
  if (avgP !== null) {
    var avgBarH = 25 + ((avgP - minP) / rangeP * 63);
    var avgLinePct = (100 - avgBarH).toFixed(1);
    marketLineHTML = '<div style="position:absolute;left:0;right:0;top:' + avgLinePct + '%;height:1px;border-top:1px dashed var(--muted);z-index:1;pointer-events:none;opacity:0.5"></div>'
                   + '<span style="position:absolute;right:3px;top:calc(' + avgLinePct + '% - 9px);font-family:var(--mono);font-size:7px;color:var(--muted);z-index:2;pointer-events:none;opacity:0.8">avg</span>';
  }


  // Tick labels every 6h
  var tickHTML = "";
  var tickStep = 360;
  var tickStart = Math.ceil(rangeStart / tickStep) * tickStep;
  for (var t = tickStart; t <= rangeEnd; t += tickStep) {
    var pct = ((t - rangeStart) / totalMins * 100).toFixed(1);
    var hh2 = Math.floor(((t % (24*60)) + 24*60) % (24*60) / 60);
    tickHTML += '<span class="tick" style="position:absolute;left:' + pct + '%">' + String(hh2).padStart(2,"0") + ':00</span>';
  }

  var hasForecast = visible.some(function(s) { return s.forecasted; });

  return '<div class="timeline-wrap">'
       + '<div style="display:flex;align-items:center;margin-bottom:4px">'
       + '<span style="font-family:var(--mono);font-size:10px;letter-spacing:0.08em;color:var(--muted);text-transform:uppercase">charging slots</span>'
       + '<span style="flex:1"></span>'
       + (hasForecast ? '<span style="display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9px;color:var(--muted)"><span style="display:inline-block;width:16px;height:8px;background:repeating-linear-gradient(45deg,var(--dim) 0px,var(--dim) 2px,var(--bg3) 2px,var(--bg3) 4px);border:1px solid var(--border2);border-radius:1px;flex-shrink:0"></span>forecasted</span>' : '')
       + '</div>'
       + '<div style="position:relative;width:100%;height:90px;background:var(--bg3);border:1px solid var(--border);border-radius:2px;overflow:visible;box-sizing:border-box;display:flex;align-items:flex-end">'
       + barsHTML
       + marketLineHTML
       + '<div style="position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;pointer-events:none">' + midnightHTML + '</div>'
       + '</div>'
       + '<div class="timeline-ticks" style="position:relative;height:16px">' + tickHTML + '</div>'
       + '</div>';
}



function renderTimelineLegacy(plan) {
  var utcOffset = (plan.utc_offset_hours || 0) * 60;
  var rangeStart, rangeEnd;
  if (plan.window_starts_utc && plan.window_starts_utc.length) {
    var wsUtc = new Date(plan.window_starts_utc[0]).getTime() + utcOffset * 60000;
    var weUtc = new Date(plan.window_ends_utc[plan.window_ends_utc.length - 1]).getTime() + utcOffset * 60000;
    var midMs = (wsUtc + weUtc) / 2;
    rangeStart = Math.round(midMs / 60000) - 12 * 60;
    rangeEnd   = rangeStart + 24 * 60;
  } else {
    rangeStart = 0; rangeEnd = 24 * 60;
  }
  var totalMins = rangeEnd - rangeStart;
  var windowHTML = "";
  if (plan.window_starts_utc && plan.window_starts_utc.length && plan.preferred_window_start !== "any") {
    var wStartMins = (new Date(plan.window_starts_utc[0]).getTime() + utcOffset * 60000) / 60000;
    var wEndMins   = (new Date(plan.window_ends_utc[plan.window_ends_utc.length-1]).getTime() + utcOffset * 60000) / 60000;
    windowHTML = '<div class="timeline-window" style="left:' + ((wStartMins-rangeStart)/totalMins*100).toFixed(2) + '%;width:' + ((wEndMins-wStartMins)/totalMins*100).toFixed(2) + '%"></div>';
  }
  var slotsHTML = "";
  if (plan.window_starts_utc) {
    for (var i = 0; i < plan.window_starts_utc.length; i++) {
      var sMin = (new Date(plan.window_starts_utc[i]).getTime() + utcOffset * 60000) / 60000;
      var eMin = (new Date(plan.window_ends_utc[i]).getTime() + utcOffset * 60000) / 60000;
      slotsHTML += '<div class="timeline-slot" style="left:' + ((sMin-rangeStart)/totalMins*100).toFixed(2) + '%;width:' + ((eMin-sMin)/totalMins*100).toFixed(2) + '%"></div>';
    }
  }
  var midnightHTML = "", dateLabelHTML = "";
  var firstMidnight = Math.ceil(rangeStart / (24*60)) * (24*60);
  for (var m = firstMidnight; m < rangeEnd; m += 24*60) {
    if (m > rangeStart) {
      var mp = ((m - rangeStart) / totalMins * 100).toFixed(2);
      var mUtcMs = (m - utcOffset) * 60000;
      var dateBefore = new Date(mUtcMs - 60000 + utcOffset*60000).toLocaleDateString("en", { weekday:"short", day:"numeric", month:"short", timeZone:"UTC" });
      var dateAfter  = new Date(mUtcMs + utcOffset*60000).toLocaleDateString("en", { weekday:"short", day:"numeric", month:"short", timeZone:"UTC" });
      midnightHTML  += '<div style="position:absolute;left:' + mp + '%;top:0;bottom:0;width:1px;background:var(--border2)"></div>';
      dateLabelHTML += '<span style="position:absolute;left:' + mp + '%;transform:translateX(-100%);padding-right:6px;font-family:var(--mono);font-size:9px;color:var(--dim);white-space:nowrap">' + dateBefore + '</span>'
                     + '<span style="position:absolute;left:' + mp + '%;padding-left:6px;font-family:var(--mono);font-size:9px;color:var(--dim);white-space:nowrap">' + dateAfter + '</span>';
    }
  }
  var tickHTML = "";
  var tickStep = 360;
  var tickStart = Math.ceil(rangeStart / tickStep) * tickStep;
  for (var t = tickStart; t <= rangeEnd; t += tickStep) {
    var pct = ((t - rangeStart) / totalMins * 100).toFixed(1);
    var hh = Math.floor(((t % (24*60)) + 24*60) % (24*60) / 60);
    tickHTML += '<span class="tick" style="position:absolute;left:' + pct + '%">' + String(hh).padStart(2,"0") + ':00</span>';
  }
  return '<div class="timeline-wrap">'
       + '<div style="position:relative;height:16px;margin-bottom:4px">'
       + '<span style="font-family:var(--mono);font-size:10px;letter-spacing:0.08em;color:var(--muted);text-transform:uppercase">charging window</span>'
       + dateLabelHTML + '</div>'
       + '<div class="timeline" style="position:relative">' + windowHTML + slotsHTML + midnightHTML + '</div>'
       + '<div class="timeline-ticks" style="position:relative;height:16px">' + tickHTML + '</div></div>';
}


function renderMarketBar(plan) {
  var ps = plan.price_stats;
  var range = ps.max_cents_kwh - ps.min_cents_kwh;
  var avgPct  = range > 0 ? ((ps.avg_cents_kwh - ps.min_cents_kwh) / range * 100).toFixed(1) : 50;
  var planPct = range > 0 ? ((plan.avg_price_cents_kwh - ps.min_cents_kwh) / range * 100).toFixed(1) : 50;
  var sav = savings(plan);
  var savStr = sav !== null ? (sav > 0 ? "\u2193" + sav.toFixed(0) + "%" : "\u2191" + Math.abs(sav).toFixed(0) + "%") : "";
  var savColor = sav !== null && sav > 0 ? "var(--accent)" : "var(--warn)";
  return '<div class="market-bar-wrap"><div class="section-label" style="margin-bottom:4px">price vs market</div>'
       + '<div class="market-bar"><div class="market-bar-fill"></div>'
       + '<div class="market-bar-avg" style="left:' + avgPct + '%"></div>'
       + '<div class="market-bar-plan" style="left:' + planPct + '%"></div></div>'
       + '<div class="market-bar-labels">'
       + '<span>' + ps.min_cents_kwh.toFixed(2) + ' c\u20ac/kWh</span>'
       + '<span style="color:' + savColor + '">' + plan.avg_price_cents_kwh.toFixed(2) + ' c\u20ac/kWh ' + savStr + '</span>'
       + '<span>' + ps.max_cents_kwh.toFixed(2) + ' c\u20ac/kWh</span>'
       + '</div></div>';
}

function renderProfile(plan) {
  var sav = savings(plan);
  var savStr = sav !== null ? (sav > 0 ? "\u2193" + sav.toFixed(0) + "%" : "\u2191" + Math.abs(sav).toFixed(0) + "%") : "\u2014";
  var savClass = sav !== null && sav > 0 ? "good" : "warn";
  var incomplete = plan.total_minutes < plan.required_minutes;
  var windowsHTML = plan.windows.map(function(w) {
    return '<div class="window-row"><span class="window-time">' + w.start + '\u2013' + w.end + '</span>'
         + '<span class="window-price">' + w.avg_price_cents_kwh.toFixed(2) + ' c\u20ac/kWh</span>'
         + '<span class="window-dur">' + fmtDuration(w.duration_minutes) + '</span></div>';
  }).join("");
  // Derive charging period from UTC window times
  var chargePeriod = plan.date;
  if (plan.window_starts_utc && plan.window_ends_utc && plan.window_starts_utc.length) {
    var utcOffset = (plan.utc_offset_hours || 0) * 60;
    var toLocal = function(utcStr) {
      var d = new Date(utcStr);
      d = new Date(d.getTime() + utcOffset * 60000);
      return d;
    };
    var startLocal = toLocal(plan.window_starts_utc[0]);
    var endLocal   = toLocal(plan.window_ends_utc[plan.window_ends_utc.length - 1]);
    var fmt = function(d) {
      return d.toLocaleDateString("en", { weekday:"short", day:"numeric", month:"short", timeZone:"UTC" });
    };
    var startStr = fmt(startLocal);
    var endStr   = fmt(endLocal);
    chargePeriod = startStr === endStr ? startStr : startStr + " → " + endStr;
  }
  var modeLabel = PROFILE_CONFIG[plan.profile] && PROFILE_CONFIG[plan.profile].continuous !== undefined
    ? ' <span style="color:var(--muted);font-size:10px">(' + (PROFILE_CONFIG[plan.profile].continuous ? 'continuous' : 'split') + ')</span>' : '';

  return '<div class="profile-card flip-card" onclick="flipCard(this)">'
       + '<div class="flip-card-inner">'
       + '<div class="flip-card-front">'
       + '<div class="card-header"><span class="profile-name">' + plan.profile + modeLabel + '</span>'
       + (function() {
           var allPast = plan.window_ends_utc && plan.window_ends_utc.length &&
             plan.window_ends_utc.every(function(e) { return new Date(e) < new Date(); });
           var style = allPast ? 'color:var(--warn)' : '';
           return '<span class="profile-date"' + (style ? ' style="' + style + '"' : '') + '>charges ' + chargePeriod + '</span></div>';
         })()
       + '<div class="stats-row">'
       + '<div class="stat"><div class="stat-label">scheduled</div><div class="stat-value' + (incomplete ? ' warn' : '') + '">' + fmtDuration(plan.total_minutes) + '<span class="stat-unit">of ' + fmtDuration(plan.required_minutes) + '</span></div></div>'
       + '<div class="stat"><div class="stat-label">@ avg price</div><div class="stat-value">' + plan.avg_price_cents_kwh.toFixed(2) + '<span class="stat-unit">c€/kWh</span></div></div>'
       + '<div class="stat"><div class="stat-label">vs market</div><div class="stat-value ' + savClass + '">' + savStr + '</div></div>'
       + (plan.avg_optimal_price_cents_kwh !== undefined && plan.price_slots
          ? (function() {
              var chargingSlots = plan.price_slots.filter(function(s) { return s.charging; });
              var matchingSlots = plan.price_slots.filter(function(s) { return s.charging && s.optimal; });
              var overlapPct = chargingSlots.length > 0 ? Math.round(matchingSlots.length / chargingSlots.length * 100) : 0;
              var cls = overlapPct === 100 ? 'good' : overlapPct >= 75 ? '' : 'warn';
              return '<div class="stat"><div class="stat-label">vs optimal</div><div class="stat-value ' + cls + '">' + overlapPct + '%</div></div>';
            })()
          : '')
       + '</div>'
       + renderTimeline(plan)
       + '<div style="padding:12px 20px 8px;display:flex;flex-direction:row;flex-wrap:wrap;gap:8px">' + windowsHTML + '</div>'
       + '<div class="flip-hint">tap to see details →</div>'
       + '</div>'
       + '<div class="flip-card-back" data-profile="' + plan.profile + '"><div class="flip-hint" style="position:static;margin-top:16px;display:block;text-align:right">← tap to go back</div></div>'
       + '</div></div>';
}

function renderProfiles(plans) {
  var el = document.getElementById("profiles");
  if (!plans.length) { el.innerHTML = '<div class="loading">no plans found</div>'; return; }
  el.innerHTML = plans.map(renderProfile).join("");
}

// ── Schedule grid ─────────────────────────────────────────────────────────
var DAYS_SHORT = ["mon","tue","wed","thu","fri","sat","sun"];
var DAYS_FULL  = ["monday","tuesday","wednesday","thursday","friday","saturday","sunday"];

function renderScheduleGrid(config) {
  var el = document.getElementById("schedule-grid");
  var todayIdx = (new Date().getDay() + 6) % 7;
  var headerCells = DAYS_SHORT.map(function(d, i) {
    return '<div class="day-label' + (i === todayIdx ? ' today' : '') + '">' + d + '</div>';
  }).join("");
  var rows = config.profiles.map(function(profile) {
    var cells = DAYS_FULL.map(function(day) {
      var entry = null;
      for (var i = 0; i < profile.schedule.length; i++) {
        if (profile.schedule[i].days.indexOf(day) !== -1) { entry = profile.schedule[i]; break; }
      }
      if (!entry) {
        if (profile.defaultStart) {
          if (profile.defaultStart === "any") return '<div class="day-cell any-window"><span class="cell-text any">any</span></div>';
          return '<div class="day-cell has-window"><span class="cell-text">' + profile.defaultStart + '<br>' + profile.defaultEnd + '</span></div>';
        }
        return '<div class="day-cell"><span class="cell-text" style="color:var(--dim)">\u2014</span></div>';
      }
      if (entry.start === "any") return '<div class="day-cell any-window"><span class="cell-text any">any</span></div>';
      return '<div class="day-cell has-window"><span class="cell-text">' + entry.start + '<br>' + entry.end + '</span></div>';
    }).join("");
    return '<div class="schedule-row"><div class="row-label">' + profile.name + '</div>' + cells + '</div>';
  }).join("");
  el.innerHTML = '<div class="schedule-header"><div class="day-label"></div>' + headerCells + '</div>' + rows;
}

// ── Config YAML parser ────────────────────────────────────────────────────
function parseConfigYaml(yaml) {
  var profiles = [];
  var currentProfile = null;
  var inSchedule = false;
  var currentEntry = null;
  var lines = yaml.split("\n");

  for (var li = 0; li < lines.length; li++) {
    var line = lines[li].replace(/\s+$/, "");
    var trimmed = line.replace(/^\s+/, "");
    var indent = line.length - trimmed.length;

    if (indent === 2 && trimmed.indexOf("- name:") === 0) {
      currentProfile = { name: trimmed.split("name:")[1].trim(), schedule: [] };
      profiles.push(currentProfile);
      inSchedule = false;
      currentEntry = null;
    } else if (currentProfile && indent === 4 && trimmed.indexOf("required_hours:") === 0) {
      currentProfile.requiredHours = parseFloat(trimmed.split(":")[1].trim());
    } else if (currentProfile && indent === 4 && trimmed.indexOf("continuous_only:") === 0) {
      currentProfile.continuous = trimmed.split(":")[1].trim().indexOf("true") === 0;
    } else if (currentProfile && indent === 4 && trimmed.indexOf("min_slot_minutes:") === 0) {
      currentProfile.minSlot = parseInt(trimmed.split(":")[1].trim(), 10);
    } else if (currentProfile && indent === 4 && trimmed.indexOf("max_price_cents_kwh:") === 0) {
      var mpVal = trimmed.split(":")[1].trim().split("#")[0].trim();
      currentProfile.maxPrice = mpVal === "null" ? null : parseFloat(mpVal);
    } else if (currentProfile && indent === 6 && trimmed.indexOf("- handler:") === 0) {
      if (!currentProfile.handlers) currentProfile.handlers = [];
      var hName = trimmed.split(":")[1].trim().split("#")[0].trim();
      // Check if this delivery is enabled (look ahead for enabled: false)
      currentProfile.handlers.push({ name: hName, enabled: true });
    } else if (currentProfile && currentProfile.handlers && currentProfile.handlers.length && indent === 8 && trimmed.indexOf("enabled:") === 0) {
      currentProfile.handlers[currentProfile.handlers.length - 1].enabled = trimmed.split(":")[1].trim().indexOf("false") === -1;
    } else if (currentProfile && indent === 4 && trimmed.indexOf("preferred_window_start:") === 0) {
      currentProfile.defaultStart = trimmed.split(":").slice(1).join(":").trim().replace(/['"]/g, "").split("#")[0].trim();
    } else if (currentProfile && indent === 4 && trimmed.indexOf("preferred_window_end:") === 0) {
      currentProfile.defaultEnd = trimmed.split(":").slice(1).join(":").trim().replace(/['"]/g, "").split("#")[0].trim();
    } else if (currentProfile && indent === 4 && trimmed.indexOf("schedule:") === 0) {
      inSchedule = true;
    } else if (inSchedule && indent === 6 && trimmed.indexOf("- days:") === 0) {
      var daysStr = trimmed.split("days:")[1].trim().replace(/[\[\]]/g, "");
      var days = daysStr.split(",").map(function(d) { return d.trim(); });
      currentEntry = { days: days, start: null, end: null };
      currentProfile.schedule.push(currentEntry);
    } else if (inSchedule && currentEntry && indent === 8) {
      if (trimmed.indexOf("preferred_window_start:") === 0) {
        currentEntry.start = trimmed.split(":").slice(1).join(":").trim().replace(/['"]/g, "").split("#")[0].trim();
      } else if (trimmed.indexOf("preferred_window_end:") === 0) {
        currentEntry.end = trimmed.split(":").slice(1).join(":").trim().replace(/['"]/g, "").split("#")[0].trim();
      }
    } else if (indent <= 2 && trimmed && trimmed[0] !== "#" && currentProfile && inSchedule) {
      if (trimmed.indexOf("-") !== 0 && trimmed.indexOf("schedule:") !== 0) inSchedule = false;
    }
  }
  return profiles.length ? { profiles: profiles } : null;
}

// ── Optimal histogram for back card ──────────────────────────────────────
function renderOptimalHistogram(plan) {
  var slots = plan.price_slots;
  if (!slots || !slots.length) return "";
  var utcOffset = (plan.utc_offset_hours || 0) * 60;
  var minP = plan.price_stats ? plan.price_stats.min_cents_kwh : 0;
  var maxP = plan.price_stats ? plan.price_stats.max_cents_kwh : 1;
  var rangeP = maxP - minP || 1;

  var rangeStart, rangeEnd;
  var firstSlotMins2 = new Date(slots[0].start_utc).getTime() / 60000 + utcOffset;
  if (plan.window_starts_utc && plan.window_starts_utc.length) {
    var wsUtc = new Date(plan.window_starts_utc[0]).getTime() + utcOffset * 60000;
    var weUtc = new Date(plan.window_ends_utc[plan.window_ends_utc.length-1]).getTime() + utcOffset * 60000;
    var midMs = (wsUtc + weUtc) / 2;
    rangeStart = Math.round(midMs / 60000) - 12 * 60;
    rangeEnd   = rangeStart + 24 * 60;
    rangeStart = Math.max(rangeStart, firstSlotMins2);
  } else {
    rangeStart = firstSlotMins2;
    rangeEnd   = rangeStart + 24 * 60;
  }
  var totalMins = rangeEnd - rangeStart;

  var visible = slots.filter(function(s) {
    var lm = new Date(s.start_utc).getTime() / 60000 + utcOffset;
    return lm >= rangeStart && lm < rangeEnd;
  });
  if (!visible.length) visible = slots;

  var n = visible.length;
  var slotWidthPct2 = (15 / totalMins * 100).toFixed(4);

  var barsHTML = '<div style="position:absolute;left:0;right:0;top:0;bottom:0;">'
  + visible.map(function(s) {
    var lm = new Date(s.start_utc).getTime() / 60000 + utcOffset;
    var leftPct = ((lm - rangeStart) / totalMins * 100).toFixed(4);
    var h = (25 + ((s.price_cents_kwh - minP) / rangeP * 63)).toFixed(1);
    var bg, border;
    if (s.charging && s.optimal) {
      bg = "var(--accent)"; border = "border-top:1px solid var(--accent2);";
    } else if (s.charging && !s.optimal) {
      bg = "repeating-linear-gradient(45deg, var(--dim) 0px, var(--dim) 2px, #1D9E75 2px, #1D9E75 4px)"; border = "border-top:1px solid var(--accent);border-left:1px solid var(--accent);border-right:1px solid var(--accent);";
    } else if (!s.charging && s.optimal) {
      bg = "transparent"; border = "border-top:1px solid var(--accent);border-left:1px solid var(--accent);border-right:1px solid var(--accent);";
    } else if (s.forecasted) {
      bg = "repeating-linear-gradient(45deg,var(--dim) 0px,var(--dim) 2px,var(--bg3) 2px,var(--bg3) 4px)"; border = "border-top:1px solid var(--border2);";
    } else {
      bg = "var(--dim)"; border = "border-top:1px solid var(--border2);";
    }
    return '<div style="position:absolute;left:' + leftPct + '%;bottom:0;width:calc(' + slotWidthPct2 + '% - 1px);height:' + h + '%;background:' + bg + ';' + border + 'box-sizing:border-box;border-radius:2px 2px 0 0"></div>';
  }).join("") + '</div>';

  var optSlots = visible.filter(function(s) { return s.optimal; });
  var optAvg = optSlots.length ? (optSlots.reduce(function(a,b){return a+b.price_cents_kwh;},0)/optSlots.length).toFixed(2) : null;

  var tickHTML = "";
  var tickStep = 360;
  var tickStart = Math.ceil(rangeStart / tickStep) * tickStep;
  for (var t = tickStart; t <= rangeEnd; t += tickStep) {
    var pct = ((t - rangeStart) / totalMins * 100).toFixed(1);
    var hh = Math.floor(((t % (24*60)) + 24*60) % (24*60) / 60);
    tickHTML += '<span class="tick" style="position:absolute;left:' + pct + '%">' + String(hh).padStart(2,"0") + ':00</span>';
  }

  // Build windows list from optimal slots in visible range
  var optWindows = [];
  var inOpt = false, winStart = null, winPrice = [], winMins = 0;
  visible.forEach(function(s, i) {
    if (s.optimal) {
      if (!inOpt) { inOpt = true; winStart = s; winPrice = []; winMins = 0; }
      winPrice.push(s.price_cents_kwh);
      winMins += 15;
    } else {
      if (inOpt) {
        var startLocal = new Date(new Date(winStart.start_utc).getTime() + utcOffset*60000);
        var endLocal   = new Date(new Date(s.start_utc).getTime() + utcOffset*60000);
        var fmt = function(d) { return String(d.getUTCHours()).padStart(2,"0") + ":" + String(d.getUTCMinutes()).padStart(2,"0"); };
        var avg = (winPrice.reduce(function(a,b){return a+b;},0)/winPrice.length).toFixed(2);
        var dur = winMins >= 60 ? Math.floor(winMins/60)+"h"+(winMins%60?String(winMins%60).padStart(2,"0")+"m":"") : winMins+"m";
        optWindows.push('<div class="window-row"><span class="window-time">' + fmt(startLocal) + "–" + fmt(endLocal) + '</span><span class="window-price">' + avg + ' c€/kWh</span><span class="window-dur">' + dur + '</span></div>');
        inOpt = false;
      }
    }
  });
  if (inOpt && winStart) {
    var last = visible[visible.length-1];
    var endLocal2 = new Date(new Date(last.start_utc).getTime() + utcOffset*60000 + 15*60000);
    var startLocal2 = new Date(new Date(winStart.start_utc).getTime() + utcOffset*60000);
    var fmt2 = function(d) { return String(d.getUTCHours()).padStart(2,"0") + ":" + String(d.getUTCMinutes()).padStart(2,"0"); };
    var avg2 = (winPrice.reduce(function(a,b){return a+b;},0)/winPrice.length).toFixed(2);
    var dur2 = winMins >= 60 ? Math.floor(winMins/60)+"h"+(winMins%60?String(winMins%60).padStart(2,"0")+"m":"") : winMins+"m";
    optWindows.push('<div class="window-row"><span class="window-time">' + fmt2(startLocal2) + "–" + fmt2(endLocal2) + '</span><span class="window-price">' + avg2 + ' c€/kWh</span><span class="window-dur">' + dur2 + '</span></div>');
  }

  // If no optimal slots in visible range, build pills from full slots and add note
  var optNote = '';
  if (!optWindows.length) {
    var allOptWindows = [];
    var inOpt2 = false, winStart2 = null, winPrice2 = [], winMins2 = 0;
    slots.filter(function(s) { return s.optimal; }).forEach(function(s) {
      if (!inOpt2) { inOpt2 = true; winStart2 = s; winPrice2 = []; winMins2 = 0; }
      winPrice2.push(s.price_cents_kwh);
      winMins2 += 15;
    });
    if (inOpt2 && winStart2) {
      // Find end of last optimal slot
      var optSlots = slots.filter(function(s) { return s.optimal; });
      var lastOpt = optSlots[optSlots.length-1];
      // Group into windows
      var prevEnd = null;
      var curWinStart = null, curWinPrices = [], curWinMins = 0;
      var fmtOpt = function(d) { return String(d.getUTCHours()).padStart(2,"0") + ":" + String(d.getUTCMinutes()).padStart(2,"0"); };
      optSlots.forEach(function(s) {
        var t = new Date(s.start_utc).getTime();
        if (!curWinStart || (prevEnd !== null && t > prevEnd)) {
          if (curWinStart) {
            var sl = new Date(curWinStart + utcOffset*60000);
            var el = new Date(prevEnd + utcOffset*60000);
            var avg3 = (curWinPrices.reduce(function(a,b){return a+b;},0)/curWinPrices.length).toFixed(2);
            var dur3 = curWinMins >= 60 ? Math.floor(curWinMins/60)+"h"+(curWinMins%60?String(curWinMins%60).padStart(2,"0")+"m":"") : curWinMins+"m";
            allOptWindows.push('<div class="window-row"><span class="window-time">' + fmtOpt(sl) + "–" + fmtOpt(el) + '</span><span class="window-price">' + avg3 + ' c€/kWh</span><span class="window-dur">' + dur3 + '</span></div>');
          }
          curWinStart = t; curWinPrices = []; curWinMins = 0;
        }
        curWinPrices.push(s.price_cents_kwh);
        curWinMins += 15;
        prevEnd = t + 15*60000;
      });
      if (curWinStart) {
        var sl2 = new Date(curWinStart + utcOffset*60000);
        var el2 = new Date(prevEnd + utcOffset*60000);
        var avg4 = (curWinPrices.reduce(function(a,b){return a+b;},0)/curWinPrices.length).toFixed(2);
        var dur4 = curWinMins >= 60 ? Math.floor(curWinMins/60)+"h"+(curWinMins%60?String(curWinMins%60).padStart(2,"0")+"m":"") : curWinMins+"m";
        allOptWindows.push('<div class="window-row"><span class="window-time">' + fmtOpt(sl2) + "–" + fmtOpt(el2) + '</span><span class="window-price">' + avg4 + ' c€/kWh</span><span class="window-dur">' + dur4 + '</span></div>');
      }
      if (allOptWindows.length) {
        optWindows = allOptWindows;
        optNote = '<div style="font-family:var(--mono);font-size:9px;color:var(--muted);padding:4px 0 0;letter-spacing:0.04em">outside visible range</div>';
      }
    }
  }

  var hasForecastOpt = visible.some(function(s) { return s.forecasted; });

  return '<div style="margin-top:16px">'
       + '<div style="display:flex;align-items:center;margin-bottom:4px">'
       + '<span style="font-family:var(--mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted)">optimal slots</span>'
       + '<span style="flex:1"></span>'
       + '<span style="display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:9px;color:var(--muted)">'
       + '<span style="display:inline-flex;align-items:center;gap:4px"><span style="display:inline-block;width:20px;height:10px;background:var(--accent);border:1px solid var(--accent2);border-radius:1px"></span>optimal</span>'
       + '<span style="display:inline-flex;align-items:center;gap:4px"><span style="display:inline-block;width:20px;height:10px;background:repeating-linear-gradient(45deg, var(--dim) 0px, var(--dim) 2px, #1D9E75 2px, #1D9E75 4px);border:1px solid var(--accent);border-radius:1px"></span>suboptimal</span>'
       + '<span style="display:inline-flex;align-items:center;gap:4px"><span style="display:inline-block;width:20px;height:10px;background:transparent;border:1px solid var(--accent);border-radius:1px"></span>missed</span>'
       + (hasForecastOpt ? '<span style="display:inline-flex;align-items:center;gap:4px"><span style="display:inline-block;width:20px;height:10px;background:repeating-linear-gradient(45deg,var(--dim) 0px,var(--dim) 2px,var(--bg3) 2px,var(--bg3) 4px);border:1px solid var(--border2);border-radius:1px"></span>forecasted</span>' : '')
       + '</span></div>'
       + '<div style="position:relative;width:100%;height:90px;background:var(--bg3);border:1px solid var(--border);border-radius:2px;overflow:visible;box-sizing:border-box;display:flex;align-items:flex-end">'
       + barsHTML
       + '</div>'
       + '<div class="timeline-ticks" style="position:relative;height:16px">' + tickHTML + '</div>'
       + (optWindows.length ? '<div style="padding:12px 0 8px;display:flex;flex-direction:row;flex-wrap:wrap;gap:8px">'
         + optWindows.join("")
         + (optNote ? '<div class="window-row" style="color:var(--warn);border-color:var(--warn)">outside visible range</div>' : '')
         + '</div>' : '')
       + '</div>';
}

// ── Flip card ────────────────────────────────────────────────────────────
function renderBackFace(profileName) {
  var cfg = PROFILE_CONFIG[profileName] || {};
  var cfgFields = [
    ["required",      cfg.requiredHours !== undefined ? cfg.requiredHours + "h" : "—"],
    ["mode",          cfg.continuous !== undefined ? '<span class="pill on">' + (cfg.continuous ? "continuous" : "split") + '</span>' : "—"],
    ["min slot",      !cfg.continuous && cfg.minSlot ? cfg.minSlot + " min" : "—"],
    ["price ceiling", cfg.maxPrice != null ? cfg.maxPrice.toFixed(2) + " c€/kWh" : "none"],
    ["delivery",      cfg.handlers && cfg.handlers.length ? (cfg.handlers.filter(function(h){return h.enabled;}).length > 0 ? '<span class="pill on">✓ configured</span>' : '<span class="pill">disabled</span>') : "—"],
  ];
  var cols = cfgFields.length;
  var table = '<div style="display:grid;grid-template-columns:repeat(' + cols + ',1fr)">'
    + cfgFields.map(function(r, i) {
        var borderR = i < cols - 1 ? "border-right:1px solid var(--border);" : "";
        return '<div style="' + borderR + 'border-bottom:1px solid var(--border)">'
             + '<div style="font-family:var(--mono);font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);padding:6px 8px">' + r[0] + '</div>'
             + '<div style="font-family:var(--mono);font-size:11px;color:var(--text);padding:4px 8px 8px">' + r[1] + '</div>'
             + '</div>';
      }).join("")
    + '</div>';

  var DAYS_S = ["mon","tue","wed","thu","fri","sat","sun"];
  var DAYS_F = ["monday","tuesday","wednesday","thursday","friday","saturday","sunday"];
  var todayIdx = (new Date().getDay() + 6) % 7;
  var schedHeaders = DAYS_S.map(function(d, i) {
    return '<div class="day-label' + (i === todayIdx ? ' today' : '') + '">' + d + '</div>';
  }).join("");
  var schedCells = DAYS_F.map(function(day) {
    var entry = null;
    for (var i = 0; i < (cfg.schedule || []).length; i++) {
      if (cfg.schedule[i].days.indexOf(day) !== -1) { entry = cfg.schedule[i]; break; }
    }
    if (!entry) {
      if (cfg.defaultStart) {
        if (cfg.defaultStart === "any") return '<div class="day-cell any-window"><span class="cell-text any">any</span></div>';
        return '<div class="day-cell has-window"><span class="cell-text">' + cfg.defaultStart + '<br>' + cfg.defaultEnd + '</span></div>';
      }
      return '<div class="day-cell"><span class="cell-text" style="color:var(--dim)">—</span></div>';
    }
    if (entry.start === "any") return '<div class="day-cell any-window"><span class="cell-text any">any</span></div>';
    return '<div class="day-cell has-window"><span class="cell-text">' + entry.start + '<br>' + entry.end + '</span></div>';
  }).join("");

  var schedule = '<div style="margin-top:20px;overflow:hidden">'
    + '<div class="back-title" style="margin-bottom:8px">weekly schedule</div>'
    + '<div class="schedule-grid">'
    + '<div class="schedule-header"><div class="day-label"></div>' + schedHeaders + '</div>'
    + '<div class="schedule-row"><div class="row-label">' + profileName + '</div>' + schedCells + '</div>'
    + '</div></div>';

  var optHistogram = PLAN_DATA[profileName] ? renderOptimalHistogram(PLAN_DATA[profileName]) : '';
  return '<div class="flip-card-back-inner"><div class="back-title">' + profileName + ' — configuration</div>'
       + table
       + optHistogram
       + schedule
       + '<div class="flip-hint" style="position:static;margin-top:16px;display:block;text-align:right">← tap to go back</div></div>';
}

function flipCard(el) {
  el.classList.toggle("flipped");
  if (el.classList.contains("flipped")) {
    var back = el.querySelector(".flip-card-back");
    var profileName = back.getAttribute("data-profile");
    if (back.getAttribute("data-rendered") !== "1") {
      var hint = back.querySelector(".flip-hint");
      back.innerHTML = renderBackFace(profileName);
      back.setAttribute("data-rendered", "1");
    }
  }
}

// ── Data loading ──────────────────────────────────────────────────────────
var FALLBACK_PLAN_NAMES = ["topup", "overnight", "optimal"];

function fetchWithTimeout(url, ms) {
  ms = ms || 4000;
  var controller = new AbortController();
  var id = setTimeout(function() { controller.abort(); }, ms);
  return fetch(url, { signal: controller.signal }).then(function(res) {
    clearTimeout(id);
    return res;
  }).catch(function(e) {
    clearTimeout(id);
    throw e;
  });
}

function loadFromRepo() {
  var configText = null;
  var names = FALLBACK_PLAN_NAMES;

  fetchWithTimeout("config.yaml?t=" + Date.now()).then(function(res) {
    if (!res.ok) throw new Error("config not ok");
    return res.text();
  }).then(function(text) {
    configText = text;
    var parsed = parseConfigYaml(text);
    if (parsed) names = parsed.profiles.map(function(p) { return p.name; });
  }).catch(function() {}).finally(function() {
    var fetches = names.map(function(name) {
      return fetchWithTimeout("data/plan-" + name + ".json?t=" + Date.now()).then(function(res) {
        return res.ok ? res.json() : null;
      }).catch(function() { return null; });
    });

    Promise.all(fetches).then(function(results) {
      var plans = results.filter(function(p) { return p !== null; });
      if (plans.length) {
        plans.forEach(function(p) { PLAN_DATA[p.profile] = p; });
        var latest = plans.reduce(function(a, b) { return a.date > b.date ? a : b; });
        var planDateObj = new Date(latest.date + 'T00:00:00Z');
        var todayObj = new Date(); todayObj.setUTCHours(0,0,0,0);
        var runTimeEl = document.getElementById('run-time');
        runTimeEl.textContent = 'created ' + latest.date;
        if (planDateObj < todayObj) runTimeEl.style.color = 'var(--warn)';
      // Show staleness warning if plan is more than 1 day old
      var planDate = new Date(latest.date + "T00:00:00Z");
      var today    = new Date();
      today.setUTCHours(0,0,0,0);
      var ageDays  = Math.floor((today - planDate) / 86400000);
      if (ageDays > 1) {
        var warn = document.createElement("div");
        warn.style.cssText = "font-family:var(--mono);font-size:11px;color:var(--warn);text-align:center;padding:8px 0;border-bottom:1px solid var(--border);margin-bottom:8px;letter-spacing:0.04em";
        warn.textContent = "\u26a0 plan data is " + ageDays + " days old — prices may not have been available yet";
        document.querySelector(".shell").insertBefore(warn, document.getElementById("profiles"));
      }
      if (plans.some(function(p) { return p.price_source === "forecast"; })) {
        var fwarn = document.createElement("div");
        fwarn.style.cssText = "font-family:var(--mono);font-size:11px;color:var(--warn);text-align:center;padding:8px 0;border-bottom:1px solid var(--border);margin-bottom:8px;letter-spacing:0.04em";
        fwarn.textContent = "\u26a0 using forecast prices — ENTSO-E was unavailable when this plan was generated";
        document.querySelector(".shell").insertBefore(fwarn, document.getElementById("profiles"));
      }
        renderProfiles(plans);
        if (configText) {
          var parsed = parseConfigYaml(configText);
          if (parsed) {
            parsed.profiles.forEach(function(p) { PROFILE_CONFIG[p.name] = p; });
          }
        }
      } else {
        document.getElementById("run-time").textContent = "no plan data found";
      }
    });
  });
}


loadFromRepo();
</script>
</body>
</html>

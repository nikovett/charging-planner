<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>charging-planner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── Light theme ── */
  :root {
    --bg:      #F7F4EF;
    --bg2:     #FFFFFF;
    --bg3:     #F2EFE9;
    --bg4:     #EDEAE3;
    --border:  #E0DDD6;
    --border2: #C8C4BC;
    --text:    #111111;
    --text2:   #555555;
    --muted:   #999999;
    --dim:     #C8C4BC;
    --accent:  #1D9E75;
    --accent2: #0F6E56;
    --warn:    #BA7517;
    --danger:  #A32D2D;
    --mono:    'IBM Plex Mono', monospace;
    --sans:    'IBM Plex Sans', sans-serif;
  }

  /* ── Dark theme ── */
  [data-theme="dark"] {
    --bg:      #0D0D0D;
    --bg2:     #1A1A1A;
    --bg3:     #111111;
    --bg4:     #252525;
    --border:  #2A2A2A;
    --border2: #383838;
    --text:    #F0F0F0;
    --text2:   #C8C8C8;
    --muted:   #666666;
    --dim:     #3A3A3A;
    --accent:  #1D9E75;
    --accent2: #00D4A0;
    --warn:    #EF9F27;
    --danger:  #EF4444;
  }

  /* ── OS preference (no manual override yet) ── */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:      #0D0D0D;
      --bg2:     #1A1A1A;
      --bg3:     #111111;
      --bg4:     #252525;
      --border:  #2A2A2A;
      --border2: #383838;
      --text:    #F0F0F0;
      --text2:   #C8C8C8;
      --muted:   #666666;
      --dim:     #3A3A3A;
      --accent:  #1D9E75;
      --accent2: #00D4A0;
      --warn:    #EF9F27;
      --danger:  #EF4444;
    }
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  .shell { max-width: 860px; margin: 0 auto; padding: 0 20px 60px; }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 0 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 28px;
  }
  .logo { font-family: var(--mono); font-size: 13px; color: var(--accent); letter-spacing: 0.08em; }
  .logo span { color: var(--muted); }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .header-meta { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .theme-toggle {
    background: none;
    border: 1px solid var(--border2);
    border-radius: 3px;
    padding: 3px 8px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    cursor: pointer;
    letter-spacing: 0.05em;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Section label ── */
  .section-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  /* ── Profile cards ── */
  .profiles { display: flex; flex-direction: column; gap: 20px; margin-bottom: 40px; }
  .profile-card { opacity: 0; transform: translateY(10px); animation: fadeUp 0.35s ease forwards; }
  .profile-card:nth-child(2) { animation-delay: 0.07s; }
  .profile-card:nth-child(3) { animation-delay: 0.14s; }
  @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

  /* ── Flip card ── */
  .flip-card { perspective: 1200px; -webkit-perspective: 1200px; cursor: pointer; }
  .flip-card-inner {
    position: relative;
    transition: transform 0.5s cubic-bezier(0.4,0.2,0.2,1);
    transform-style: preserve-3d;
    border: 1px solid var(--border);
    border-top: 4px solid var(--accent);
    border-radius: 4px;
  }
  .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
  .flip-card.flipped .flip-card-front { visibility: hidden; }
  .flip-card-front, .flip-card-back {
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: var(--bg2);
    border-radius: 3px;
    overflow: hidden;
    transform: translateZ(0);
    -webkit-transform: translateZ(0);
  }
  .flip-card-front { position: relative; }
  .flip-card-back {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    width: 100%; transform: rotateY(180deg);
    overflow-y: auto; visibility: hidden;
  }
  .flip-card.flipped .flip-card-back { visibility: visible; }
  .flip-card-back-inner { padding: 18px 20px; }
  .flip-hint { font-family: var(--mono); font-size: 9px; color: var(--dim); letter-spacing: 0.05em; }

  /* ── Card header ── */
  .card-header {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 14px 20px 10px; border-bottom: 1px solid var(--border);
  }
  .profile-name { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
  .profile-date { font-family: var(--mono); font-size: 11px; color: var(--muted); }

  /* ── Heroes ── */
  .heroes { display: grid; grid-template-columns: 1fr 1px 1fr; border-bottom: 1px solid var(--border); }
  .hero-divider { background: var(--border); }
  .hero { padding: 14px 20px 12px; }
  .hero:first-child { padding-left: 20px; }
  .hero-label { font-family: var(--mono); font-size: 9px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 3px; }
  .hero-price { font-family: var(--sans); font-size: 44px; font-weight: 500; line-height: 1; color: var(--text); }
  .hero-price.accent { color: var(--accent); }
  .hero-unit { font-family: var(--mono); font-size: 13px; color: var(--muted); font-weight: 400; }
  .hero-details { display: flex; gap: 14px; margin-top: 5px; flex-wrap: wrap; }
  .hero-det { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .hero-det strong { color: var(--text2); font-weight: 500; }
  .hero-det .good { color: var(--accent); font-weight: 500; }
  .hero-det .warn { color: var(--warn); font-weight: 500; }

  /* ── Timeline ── */
  .timeline-wrap { padding: 14px 20px 0; }
  .timeline-label-row {
    display: flex; align-items: center; justify-content: space-between;
    font-family: var(--mono); font-size: 9px; color: var(--muted);
    letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 7px;
  }
  .legend-row { display: inline-flex; align-items: center; gap: 10px; text-transform: none; letter-spacing: 0; }
  .legend-item { display: inline-flex; align-items: center; gap: 3px; }
  .legend-swatch { display: inline-block; width: 14px; height: 7px; border-radius: 1px; flex-shrink: 0; }
  .histogram {
    position: relative; width: 100%; height: 112px;
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 2px; overflow: visible; display: flex; align-items: flex-end;
  }
  .timeline-ticks { position: relative; height: 16px; margin-bottom: 2px; }
  .tick { position: absolute; font-family: var(--mono); font-size: 9px; color: var(--dim); transform: translateX(-50%); }

  /* ── Window pills ── */
  .windows-row {
    padding: 10px 20px 12px;
    display: flex; flex-direction: row; flex-wrap: wrap;
    gap: 8px; align-items: center; justify-content: space-between;
  }
  .windows-pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .window-pill {
    font-family: var(--mono); font-size: 11px;
    color: var(--text2); background: var(--bg3);
    border: 1px solid var(--border); border-radius: 3px; padding: 5px 10px;
  }
  .window-pill .w-price { color: var(--accent); font-weight: 500; }
  .window-pill .w-dur   { color: var(--muted); }

  /* ── Back card ── */
  .back-title {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    letter-spacing: 0.08em; text-transform: uppercase;
    margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border);
  }
  .config-grid {
    display: grid; grid-template-columns: repeat(4,1fr);
    gap: 1px; background: var(--border); border: 1px solid var(--border); margin-bottom: 20px;
  }
  .config-cell { background: var(--bg2); padding: 8px 10px; }
  .config-label { font-family: var(--mono); font-size: 9px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .config-val { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--text2); }
  .badge { display: inline-block; padding: 2px 7px; border-radius: 3px; font-family: var(--mono); font-size: 10px; background: var(--bg3); border: 1px solid var(--border2); color: var(--text2); }
  .badge.on { border-color: var(--accent); color: var(--accent); }

  /* ── Schedule grid ── */
  .sched-section { }
  .sched-section-label { font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .schedule-grid {
    display: grid; grid-template-columns: minmax(52px,64px) repeat(7,1fr);
    gap: 1px; background: var(--border); border: 1px solid var(--border);
  }
  .sched-cell { font-family: var(--mono); font-size: 9px; padding: 5px 4px; text-align: center; background: var(--bg2); color: var(--text2); line-height: 1.4; }
  .sched-cell.head  { background: var(--bg3); color: var(--muted); display: flex; align-items: center; justify-content: center; }
  .sched-cell.today { color: var(--accent); }
  .sched-cell.any   { color: var(--text2); display: flex; align-items: center; justify-content: center; }
  .sched-cell.empty { color: var(--border2); }

  /* ── Footer ── */
  footer {
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 0; border-top: 1px solid var(--border);
    font-family: var(--mono); font-size: 10px; color: var(--muted);
  }
  .footer-link { color: var(--accent); text-decoration: none; }
  .footer-link:hover { text-decoration: underline; }

  .loading { font-family: var(--mono); font-size: 12px; color: var(--muted); padding: 20px 0; }
  .warn-banner {
    font-family: var(--mono); font-size: 11px; color: var(--warn);
    text-align: center; padding: 8px 0; border-bottom: 1px solid var(--border);
    margin-bottom: 8px; letter-spacing: 0.04em;
  }

  @media (max-width: 600px) {
    .heroes { grid-template-columns: 1fr; }
    .hero-divider { display: none; }
    .hero-price { font-size: 36px; }
    .config-grid { grid-template-columns: repeat(2,1fr); }
  }
</style>
</head>
<body>
<div class="shell">

  <header>
    <div class="logo">charging<span>-</span>planner</div>
    <div class="header-right">
      <div class="header-meta"><div id="run-time">—</div></div>
      <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">dark</button>
    </div>
  </header>

  <div class="section-label">latest plans</div>
  <div class="profiles" id="profiles"><div class="loading">loading plans…</div></div>

  <footer>
    <span>charging-planner · ENTSO-E day-ahead prices</span>
    <a class="footer-link" href="https://github.com" id="repo-link">view repository →</a>
  </footer>

</div>
<script>
var PROFILE_CONFIG = {};
var PLAN_DATA      = {};

// ── Theme ─────────────────────────────────────────────────────────────────
(function() {
  var saved = localStorage.getItem("cp-theme");
  var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  var dark = saved ? (saved === "dark") : prefersDark;
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
})();

function toggleTheme() {
  var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("cp-theme", next);
  document.getElementById("theme-btn").textContent = next === "dark" ? "light" : "dark";
}

// set initial button label
(function() {
  var t = document.documentElement.getAttribute("data-theme");
  var btn = document.getElementById("theme-btn");
  if (btn) btn.textContent = t === "dark" ? "light" : "dark";
})();

// ── Helpers ───────────────────────────────────────────────────────────────
function fmtDuration(minutes) {
  var h = Math.floor(minutes / 60), m = minutes % 60;
  if (h > 0 && m > 0) return h + "h" + m + "m";
  if (h > 0) return h + "h";
  return m + "m";
}

function savings(plan) {
  if (!plan.price_stats || !plan.avg_price_cents_kwh) return null;
  var avg = plan.price_stats.avg_cents_kwh;
  if (!avg) return null;
  return (avg - plan.avg_price_cents_kwh) / avg * 100;
}

// ── Histogram ─────────────────────────────────────────────────────────────
function renderTimeline(plan, profileName, nowPrice) {
  var slots = plan.price_slots;
  if (!slots || !slots.length) return "";

  var utcOffset = (plan.utc_offset_hours || 0) * 60;
  var minP = plan.price_stats ? plan.price_stats.min_cents_kwh : 0;
  var rangeP = 1; // placeholder, recomputed after visible is known

  // Find now slot
  var nowMs = Date.now();
  var nowSlot = null;
  for (var ni = 0; ni < slots.length; ni++) {
    var st = new Date(slots[ni].start_utc).getTime();
    if (nowMs >= st && nowMs < st + 15*60000) { nowSlot = slots[ni]; break; }
  }

  // Histogram range:
  // Mode 1 (charging far away): anchor on now-1h, extend to cover all charging slots +1h.
  //   Window = max(24h, now-1h → last_slot_end+1h). Now stays 1h from left.
  // Mode 2 (charging close, mid within 11h of now): center on charging midpoint ±12h.
  //   Now floats but is always visible since charging is nearby.
  var allLm  = slots.map(function(s) { return new Date(s.start_utc).getTime()/60000 + utcOffset; });
  var cLm    = slots.filter(function(s){return s.charging;}).map(function(s){ return new Date(s.start_utc).getTime()/60000 + utcOffset; });
  var nowLm  = Date.now()/60000 + utcOffset;
  var rangeStart, rangeEnd;
  if (cLm.length) {
    var mid        = (Math.min.apply(null,cLm) + Math.max.apply(null,cLm)) / 2;
    var lastSlotLm = Math.max.apply(null,cLm) + 15; // end of last charging slot
    if (nowLm >= mid) {
      // Mode 3: now-centered ±12h. Now has reached or passed the charging midpoint —
      // window tracks now, revealing forecast bars to the right as time progresses.
      rangeStart = nowLm - 12*60;
      rangeEnd   = nowLm + 12*60;
    } else if (mid - 12*60 <= nowLm - 60) {
      // Mode 2: charge-centered ±12h (now is within the window naturally)
      rangeStart = mid - 12*60;
      rangeEnd   = mid + 12*60;
    } else {
      // Mode 1: anchor on now-1h, guarantee all charging slots +1h are visible
      rangeStart = nowLm - 60;
      rangeEnd   = Math.max(rangeStart + 24*60, lastSlotLm + 60);
    }
  } else {
    // No charging slots — now-centered ±12h (same as Mode 3)
    rangeStart = nowLm - 12*60;
    rangeEnd   = nowLm + 12*60;
  }
  rangeStart = Math.max(rangeStart, Math.min.apply(null,allLm));
  // Snap to 15-minute slot boundaries so bars fill edge to edge
  rangeStart = Math.floor(rangeStart / 15) * 15;
  rangeEnd   = Math.ceil(rangeEnd / 15) * 15;
  var totalMins = rangeEnd - rangeStart;

  var visible = slots.filter(function(s) {
    var lm = new Date(s.start_utc).getTime()/60000 + utcOffset;
    return lm >= rangeStart && lm < rangeEnd;
  });
  if (!visible.length) visible = slots;

  // Scale is based on the maximum price visible in the current histogram window,
  // not the global max from the selection pool which may be off-screen.
  var visiblePrices = visible.filter(function(s){ return s.price_cents_kwh > 0; })
                             .map(function(s){ return s.price_cents_kwh; });
  var maxP = visiblePrices.length ? Math.max.apply(null, visiblePrices) : 1;

  // Nice ceiling: round maxP up to a clean value that gives 3–5 evenly-spaced ticks.
  // Strategy: try each candidate interval, compute the ceiling it produces, and
  // pick the candidate that gives the most ticks without exceeding 5.
  // Zero is always shown at the bottom; ticks are at interval, 2×, 3×, … niceCeil.
  var niceSteps = [0.5,1,2,5,10,25,50,100,150,200,500,1000];
  var niceInterval = 1, niceCeil = 100;
  var bestTicks = 0;
  for (var ni2 = 0; ni2 < niceSteps.length; ni2++) {
    var step = niceSteps[ni2];
    var c = Math.ceil(maxP / step) * step;
    var ticks = Math.round(c / step);
    if (ticks >= 3 && ticks <= 5 && (bestTicks === 0 || ticks > bestTicks || (ticks === bestTicks && c < niceCeil))) {
      niceInterval = step; niceCeil = c; bestTicks = ticks;
    }
  }
  // Fallback: if no candidate gave 3–5 ticks, use the smallest ceiling with ≤5 ticks
  if (bestTicks === 0) {
    for (var ni3 = 0; ni3 < niceSteps.length; ni3++) {
      var step2 = niceSteps[ni3];
      var c2 = Math.ceil(maxP / step2) * step2;
      if (c2 / step2 <= 5 && c2 < niceCeil) { niceInterval = step2; niceCeil = c2; }
    }
  }

  var slotW = (15/totalMins*100).toFixed(4);

  var barsHTML = '<div style="position:absolute;left:0;right:0;top:0;bottom:0;">'
    + visible.map(function(s) {
        var lm      = new Date(s.start_utc).getTime()/60000 + utcOffset;
        var leftPct = ((lm-rangeStart)/totalMins*100).toFixed(4);
        var effectiveMin = Math.min(minP, 0);
        // Scale bars from 0 to niceCeil so ticks are proportional
        var h = (s.price_cents_kwh <= 0 && !s.forecasted)
          ? "0"
          : (Math.max(0, s.price_cents_kwh - effectiveMin) / (niceCeil - effectiveMin) * 90).toFixed(1);
        var isNow   = nowSlot && s.start_utc === nowSlot.start_utc;
        var bg, extra = "";

        if (s.charging && s.optimal) {
          bg = "var(--accent)";
        } else if (s.charging && !s.optimal) {
          bg = "repeating-linear-gradient(45deg,var(--dim) 0px,var(--dim) 2px,var(--accent) 2px,var(--accent) 4px)";
        } else if (!s.charging && s.optimal) {
          bg = "transparent"; extra = "border:1px solid var(--accent);";
        } else if (s.forecasted) {
          bg = "repeating-linear-gradient(45deg,var(--dim) 0px,var(--dim) 2px,var(--bg3) 2px,var(--bg3) 4px)";
        } else if (isNow) {
          bg = "var(--border2)";
        } else {
          bg = "var(--dim)";
        }

        var playhead = isNow
          ? '<svg style="position:absolute;left:50%;top:-8px;transform:translateX(-50%);overflow:visible;pointer-events:none" width="8" height="6" viewBox="0 0 8 6"><polygon points="4,6 0,0 8,0" fill="var(--text2)"/></svg>'
          : "";

        var hoverTime = "";
        var localMinOfDay = ((lm % (24*60)) + 24*60) % (24*60);
        hoverTime = String(Math.floor(localMinOfDay / 60)).padStart(2,"0") + ":" + String(Math.floor(localMinOfDay % 60)).padStart(2,"0");

        var onEnter = profileName
          ? 'onmouseenter="hoverBar(this,\'' + profileName + '\')" onmouseleave="unhoverBar(\'' + profileName + '\')" ontouchstart="barTouch(event,this,\'' + profileName + '\')"'
          : '';

        return '<div data-price="' + s.price_cents_kwh.toFixed(2) + '" data-time="' + hoverTime + '" data-charging="' + (s.charging ? '1' : '0') + '" ' + onEnter
             + ' style="position:absolute;left:' + leftPct + '%;bottom:0;width:calc(' + slotW + '% - 1px);height:' + h + '%;background:' + bg + ';' + extra + 'box-sizing:border-box;border-radius:2px 2px 0 0">' + playhead + '</div>';
      }).join("")
    + '</div>';

  // Avg line
  var _effMin = Math.min(minP, 0);
  var avgH = (100 - (plan.price_stats.avg_cents_kwh - _effMin) / (niceCeil - _effMin) * 90).toFixed(1);
  var avgLine = '<div style="position:absolute;left:0;right:0;top:' + avgH + '%;border-top:1px dashed var(--border2);pointer-events:none"></div>'
              + '<div style="position:absolute;right:4px;bottom:calc(' + (100-parseFloat(avgH)) + '% + 2px);font-family:var(--mono);font-size:7px;color:var(--dim)">avg</div>';

  // Price ticks — vertical axis to the right of the histogram
  // Each tick has a short horizontal line touching the histogram edge and a label
  var _effMin2 = Math.min(minP, 0);
  var priceTicksHTML = '';
  // Zero tick at the bottom
  priceTicksHTML += '<div style="position:absolute;top:calc(100% - 5px);left:0;display:flex;align-items:center;gap:2px;white-space:nowrap">'
    + '<div style="width:4px;height:1px;background:var(--dim);flex-shrink:0"></div>'
    + '<span style="font-family:var(--mono);font-size:7px;color:var(--dim);line-height:1">0</span>'
    + '</div>';
  for (var tick = niceInterval; tick <= niceCeil; tick += niceInterval) {
    var tickPct = (100 - (tick - _effMin2) / (niceCeil - _effMin2) * 90).toFixed(1);
    priceTicksHTML += '<div style="position:absolute;top:calc(' + tickPct + '% - 5px);left:0;display:flex;align-items:center;gap:2px;white-space:nowrap">'
      + '<div style="width:4px;height:1px;background:var(--dim);flex-shrink:0"></div>'
      + '<span style="font-family:var(--mono);font-size:7px;color:var(--dim);line-height:1">' + tick + '</span>'
      + '</div>';
  }

  // Ticks
  var tickHTML = "";
  var tickStart = Math.ceil(rangeStart/60)*60;
  // Use 4h ticks on narrow screens (<520px), 2h on wider screens
  var tickInterval = window.innerWidth < 520 ? 240 : 120;
  for (var tm = tickStart; tm <= rangeEnd; tm += tickInterval) {
    var tpct = ((tm-rangeStart)/totalMins*100).toFixed(2);
    var hh   = Math.floor(((tm%(24*60))+24*60)%(24*60)/60);
    tickHTML += '<span class="tick" style="left:' + tpct + '%">' + String(hh).padStart(2,"0") + ":00</span>";
  }

  // Legend
  var hasForecast   = visible.some(function(s){ return s.forecasted; });
  var hasMissed     = visible.some(function(s){ return !s.charging && s.optimal; });
  var hasSuboptimal = visible.some(function(s){ return s.charging && !s.optimal; });
  var hasOptimal    = visible.some(function(s){ return s.charging && s.optimal; });
  var legendHTML = '<div class="legend-row">'
    + (hasOptimal ? '<span class="legend-item"><span class="legend-swatch" style="background:var(--accent)"></span>optimal</span>' : '')
    + (hasSuboptimal ? '<span class="legend-item"><span class="legend-swatch" style="background:repeating-linear-gradient(45deg,var(--dim) 0px,var(--dim) 2px,var(--accent) 2px,var(--accent) 4px)"></span>suboptimal</span>' : '')
    + (hasMissed ? '<span class="legend-item"><span class="legend-swatch" style="background:transparent;border:1px solid var(--accent)"></span>missed</span>' : '')
    + (hasForecast ? '<span class="legend-item"><span class="legend-swatch" style="background:repeating-linear-gradient(45deg,var(--dim) 0px,var(--dim) 2px,var(--bg3) 2px,var(--bg3) 4px);border:1px solid var(--border2)"></span>forecast</span>' : '')
    + '</div>';

  return '<div class="timeline-wrap">'
       + '<div class="timeline-label-row"><span>charging slots</span>' + legendHTML + '</div>'
       + '<div style="display:flex;align-items:stretch;gap:0">'
       + '<div class="histogram" style="flex:1;-webkit-user-select:none;user-select:none;touch-action:pan-y" ontouchmove="histoTouchMove(event,\'' + profileName + '\')" ontouchend="unhoverBar(\'' + profileName + '\')" ontouchcancel="unhoverBar(\'' + profileName + '\')">'
       + avgLine + barsHTML
       + '</div>'
       + '<div style="position:relative;flex-shrink:0;width:calc(6px + ' + (String(niceCeil).length * 6) + 'px)">' + priceTicksHTML + '</div>'
       + '</div>'
       + '<div class="timeline-ticks">' + tickHTML + '</div>'
       + '</div>';
}

// ── Histogram bar hover ───────────────────────────────────────────────────
var NOW_PRICE_ORIG  = {};
var AVG_PRICE_ORIG  = {};
var AVG_LABEL_ORIG  = {};

function hoverBar(el, profileName) {
  var priceEl    = document.getElementById("now-price-"  + profileName);
  var labelEl    = document.getElementById("now-label-"  + profileName);
  var avgPriceEl = document.getElementById("avg-price-"  + profileName);
  var avgLabelEl = document.getElementById("avg-label-"  + profileName);
  if (!priceEl || !labelEl) return;

  if (!NOW_PRICE_ORIG[profileName])  NOW_PRICE_ORIG[profileName]  = priceEl.innerHTML;
  if (avgPriceEl && !AVG_PRICE_ORIG[profileName]) AVG_PRICE_ORIG[profileName] = avgPriceEl.innerHTML;
  if (avgLabelEl && !AVG_LABEL_ORIG[profileName]) AVG_LABEL_ORIG[profileName] = avgLabelEl.textContent;

  var price      = el.getAttribute("data-price");
  var time       = el.getAttribute("data-time");
  var isCharging = el.getAttribute("data-charging") === "1";

  // Right hero: always shows hovered slot price + time
  priceEl.innerHTML   = price + ' <span class="hero-unit">c\u20ac/kWh</span>';
  labelEl.textContent = time || "now";

  // Left hero: show window avg + time range when hovering a charging slot
  if (avgPriceEl && avgLabelEl && isCharging) {
    var plan = PLAN_DATA[profileName];
    if (plan && plan.windows) {
      var barTime = el.getAttribute("data-time");
      var win = null;
      for (var i = 0; i < plan.windows.length; i++) {
        var w = plan.windows[i];
        var overnight = w.end < w.start;
        var inWindow  = overnight
          ? (barTime >= w.start || barTime < w.end)
          : (barTime >= w.start && barTime < w.end);
        if (inWindow) { win = w; break; }
      }
      if (win) {
        avgPriceEl.innerHTML   = win.avg_price_cents_kwh.toFixed(2) + ' <span class="hero-unit">c\u20ac/kWh</span>';
        avgLabelEl.textContent = win.start + "\u2013" + win.end;
      }
    }
  } else if (avgPriceEl && avgLabelEl && !isCharging) {
    // Revert left hero when hovering non-charging bar
    if (AVG_PRICE_ORIG[profileName]) avgPriceEl.innerHTML    = AVG_PRICE_ORIG[profileName];
    if (AVG_LABEL_ORIG[profileName]) avgLabelEl.textContent  = AVG_LABEL_ORIG[profileName];
  }
}

function unhoverBar(profileName) {
  var priceEl    = document.getElementById("now-price-"  + profileName);
  var labelEl    = document.getElementById("now-label-"  + profileName);
  var avgPriceEl = document.getElementById("avg-price-"  + profileName);
  var avgLabelEl = document.getElementById("avg-label-"  + profileName);
  if (priceEl    && NOW_PRICE_ORIG[profileName])  priceEl.innerHTML    = NOW_PRICE_ORIG[profileName];
  if (labelEl)                                     labelEl.textContent  = "now";
  if (avgPriceEl && AVG_PRICE_ORIG[profileName])  avgPriceEl.innerHTML  = AVG_PRICE_ORIG[profileName];
  if (avgLabelEl && AVG_LABEL_ORIG[profileName])  avgLabelEl.textContent = AVG_LABEL_ORIG[profileName];
}


function renderProfile(plan) {
  var sav      = savings(plan);
  var savStr   = sav !== null ? (sav > 0 ? "\u2193" + sav.toFixed(0) + "%" : "\u2191" + Math.abs(sav).toFixed(0) + "%") : "\u2014";
  var savClass = sav !== null && sav > 0 ? "good" : "warn";
  var incomplete = plan.total_minutes < plan.required_minutes;

  // vs optimal — only show when there are suboptimal charging slots in the plan
  var optStr = "";
  var hasSuboptimal = (plan.price_slots || []).some(function(s) { return s.charging && !s.optimal && !s.forecasted; });
  if (hasSuboptimal && plan.avg_optimal_price_cents_kwh && plan.avg_price_cents_kwh) {
    var optDiff = ((plan.avg_price_cents_kwh - plan.avg_optimal_price_cents_kwh) / plan.avg_optimal_price_cents_kwh * 100);
    var optSign = optDiff > 0 ? "\u2191" : "\u2193";
    var optClass = optDiff > 0 ? "warn" : "good";
    optStr = '<div class="hero-det">vs optimal <span class="' + optClass + '">' + optSign + Math.abs(optDiff).toFixed(0) + '%</span></div>';
  }

  // Charge period
  var chargePeriod = plan.date;
  if (plan.window_starts_utc && plan.window_starts_utc.length) {
    var utcOff = (plan.utc_offset_hours || 0) * 60;
    var toLoc  = function(u) { var d = new Date(u); return new Date(d.getTime() + utcOff*60000); };
    var fmtDay = function(d) { return d.toLocaleDateString("en",{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"}); };
    var s1 = fmtDay(toLoc(plan.window_starts_utc[0]));
    var e1 = fmtDay(toLoc(plan.window_ends_utc[plan.window_ends_utc.length-1]));
    chargePeriod = s1 === e1 ? s1 : s1 + " \u2192 " + e1;
  }
  var allPast  = plan.window_ends_utc && plan.window_ends_utc.every(function(e){return new Date(e)<new Date();});
  var dateStyle = allPast ? ' style="color:var(--warn)"' : '';

  // Now price
  var nowMs = Date.now(), nowPrice = null;
  if (plan.price_slots) {
    for (var ni = 0; ni < plan.price_slots.length; ni++) {
      var st = new Date(plan.price_slots[ni].start_utc).getTime();
      if (nowMs >= st && nowMs < st+15*60000) { nowPrice = plan.price_slots[ni].price_cents_kwh; break; }
    }
  }

  // Hero left: avg scheduled
  var retainedStr = (plan.retained_minutes > 0)
    ? ' <span style="color:var(--accent2)">(' + fmtDuration(plan.retained_minutes) + ' carried over)</span>'
    : '';
  var warningStr = '';
  if (plan.plan_warning) {
    var shortWarn = plan.plan_warning.indexOf('price limit') !== -1
      ? plan.plan_warning.replace('partial plan \u2014 ', '')
      : 'required hours exceed boundaries';
    warningStr = ' <span style="color:var(--warn)">(' + shortWarn + ')</span>';
  }
  var heroL = '<div class="hero">'
    + '<div class="hero-label" id="avg-label-' + plan.profile + '">avg scheduled</div>'
    + '<div class="hero-price accent" id="avg-price-' + plan.profile + '">' + plan.avg_price_cents_kwh.toFixed(2) + ' <span class="hero-unit">c\u20ac/kWh</span></div>'
    + '<div class="hero-details">'
    + '<div class="hero-det">scheduled <strong>' + fmtDuration(plan.total_minutes) + (incomplete ? '&thinsp;of&thinsp;' + fmtDuration(plan.required_minutes) : '') + '</strong>' + retainedStr + warningStr + '</div>'
    + '<div class="hero-det">vs market <span class="' + savClass + '">' + savStr + '</span></div>'
    + optStr
    + '</div></div>';

  // Hero right: now + market stats
  var heroR = '<div class="hero">'
    + '<div class="hero-label" id="now-label-' + plan.profile + '">now</div>'
    + '<div class="hero-price" id="now-price-' + plan.profile + '">' + (nowPrice !== null ? nowPrice.toFixed(2) : '\u2014') + ' <span class="hero-unit">c\u20ac/kWh</span></div>'
    + '<div class="hero-details">'
    + (plan.price_stats
        ? '<div class="hero-det">min <span class="good">' + plan.price_stats.min_cents_kwh.toFixed(2) + '</span></div>'
        + '<div class="hero-det">avg <strong>' + plan.price_stats.avg_cents_kwh.toFixed(2) + '</strong></div>'
        + '<div class="hero-det">max <span class="warn">' + plan.price_stats.max_cents_kwh.toFixed(2) + '</span></div>'
        : '')
    + '</div></div>';

  // Window pills
  var pillsHTML = plan.windows.map(function(w) {
    return '<div class="window-pill">' + w.start + '\u2013' + w.end
         + ' <span class="w-price">' + w.avg_price_cents_kwh.toFixed(2) + ' c\u20ac/kWh</span>'
         + ' <span class="w-dur">' + fmtDuration(w.duration_minutes) + '</span></div>';
  }).join("");

  return '<div class="profile-card flip-card" onclick="flipCard(this)">'
       + '<div class="flip-card-inner">'
       + '<div class="flip-card-front">'
       + '<div class="card-header">'
       + '<span class="profile-name">' + plan.profile + '</span>'
       + '<span class="profile-date"' + dateStyle + '>charges ' + chargePeriod + '</span>'
       + '</div>'
       + '<div class="heroes">' + heroL + '<div class="hero-divider"></div>' + heroR + '</div>'
       + renderTimeline(plan, plan.profile, nowPrice)
       + '<div class="windows-row"><div class="windows-pills">' + pillsHTML + '</div>'
       + '<div class="flip-hint">tap to see details \u2192</div></div>'
       + '</div>'
       + '<div class="flip-card-back" data-profile="' + plan.profile + '"></div>'
       + '</div></div>';
}

function renderProfiles(plans) {
  var el = document.getElementById("profiles");
  if (!plans.length) { el.innerHTML = '<div class="loading">no plans found</div>'; return; }
  el.innerHTML = plans.map(renderProfile).join("");
}

// ── Back card ─────────────────────────────────────────────────────────────
function renderBackFace(profileName) {
  var cfg = PROFILE_CONFIG[profileName] || {};

  var cfgFields = [
    ["charging slots", cfg.continuous !== undefined ? '<span class="badge on">' + (cfg.continuous ? "continuous" : "split") + '</span>' : '<span class="badge">\u2014</span>'],
    ["min slot", !cfg.continuous && cfg.minSlot ? '<span class="badge on">' + cfg.minSlot + ' min</span>' : '<span class="badge">\u2014</span>'],
    ["price limit",  cfg.maxPrice != null ? '<span class="badge on">' + (cfg.maxPrice === "avg" ? "avg" : cfg.maxPrice.toFixed(2) + ' c\u20ac/kWh') + '</span>' : '<span class="badge">none</span>'],
    ["charger delivery", cfg.handlers && cfg.handlers.length
                   ? (cfg.handlers.some(function(h){return h.enabled;}) ? '<span class="badge on">\u2713 on</span>' : '<span class="badge">off</span>')
                   : '<span class="badge">\u2014</span>'],
  ];

  var configHTML = '<div class="config-grid">'
    + cfgFields.map(function(f) {
        return '<div class="config-cell"><div class="config-label">' + f[0] + '</div><div class="config-val">' + f[1] + '</div></div>';
      }).join("")
    + '</div>';

  var DAYS_S   = ["mon","tue","wed","thu","fri","sat","sun"];
  var DAYS_F   = ["monday","tuesday","wednesday","thursday","friday","saturday","sunday"];
  var todayIdx = (new Date().getDay() + 6) % 7;

  var headerRow = '<div class="sched-cell head"></div>'
    + DAYS_S.map(function(d,i){ return '<div class="sched-cell head' + (i===todayIdx?' today':'') + '">' + d + '</div>'; }).join("");

  var dataRow = '<div class="sched-cell head">window</div>'
    + DAYS_F.map(function(day) {
        var entry = null;
        for (var i=0; i<(cfg.schedule||[]).length; i++) {
          if (cfg.schedule[i].days.indexOf(day) !== -1) { entry = cfg.schedule[i]; break; }
        }
        var start = entry ? entry.start : cfg.defaultStart;
        var end   = entry ? entry.end   : cfg.defaultEnd;
        if (!start)          return '<div class="sched-cell empty">\u2014</div>';
        if (start === "any") return '<div class="sched-cell any">any</div>';
        return '<div class="sched-cell">' + start + '<br>' + end + '</div>';
      }).join("");

  // Required hours row — show per-day override if present, else top-level default
  var reqRow = '<div class="sched-cell head">required</div>'
    + DAYS_F.map(function(day) {
        var entry = null;
        for (var i=0; i<(cfg.schedule||[]).length; i++) {
          if (cfg.schedule[i].days.indexOf(day) !== -1) { entry = cfg.schedule[i]; break; }
        }
        var rh = (entry && entry.requiredHours !== undefined) ? entry.requiredHours : cfg.requiredHours;
        if (rh === undefined) return '<div class="sched-cell empty">\u2014</div>';
        return '<div class="sched-cell any">' + rh + 'h</div>';
      }).join("");

  var schedHTML = '<div class="sched-section">'
    + '<div class="sched-section-label">weekly schedule</div>'
    + '<div class="schedule-grid">' + headerRow + dataRow + reqRow + '</div>'
    + '</div>';

  return '<div class="flip-card-back-inner">'
       + '<div class="back-title">' + profileName + ' \u2014 configuration</div>'
       + configHTML + schedHTML
       + '<div style="margin-top:16px;text-align:right"><span class="flip-hint">\u2190 tap to go back</span></div>'
       + '</div>';
}

function barTouch(e, el, profileName) {
  e.stopPropagation();
  e.preventDefault();
  hoverBar(el, profileName);
}

function histoTouchMove(e, profileName) {
  e.stopPropagation();
  e.preventDefault();
  var touch = e.touches[0];
  var el = document.elementFromPoint(touch.clientX, touch.clientY);
  // Walk up to find a bar div with data-price
  while (el && !el.getAttribute("data-price")) { el = el.parentElement; }
  if (el && el.getAttribute("data-price")) hoverBar(el, profileName);
}

function flipCard(el) {
  el.classList.toggle("flipped");
  if (el.classList.contains("flipped")) {
    var back = el.querySelector(".flip-card-back");
    if (back.getAttribute("data-rendered") !== "1") {
      back.innerHTML = renderBackFace(back.getAttribute("data-profile"));
      back.setAttribute("data-rendered","1");
    }
  }
}

// ── YAML parser ───────────────────────────────────────────────────────────
function parseConfigYaml(yaml) {
  var profiles = [], currentProfile = null, inSchedule = false, currentEntry = null;
  var lines = yaml.split("\n");
  for (var li = 0; li < lines.length; li++) {
    var line = lines[li].replace(/\s+$/,""), trimmed = line.replace(/^\s+/,""), indent = line.length - trimmed.length;
    if (indent===2 && trimmed.indexOf("- name:")===0) {
      currentProfile = { name: trimmed.split("name:")[1].trim(), schedule:[] };
      profiles.push(currentProfile); inSchedule=false; currentEntry=null;
    } else if (currentProfile && indent===4 && trimmed.indexOf("required_hours:")===0) {
      currentProfile.requiredHours = parseFloat(trimmed.split(":")[1].trim());
    } else if (currentProfile && indent===4 && trimmed.indexOf("continuous_only:")===0) {
      currentProfile.continuous = trimmed.split(":")[1].trim().indexOf("true")===0;
    } else if (currentProfile && indent===4 && trimmed.indexOf("min_slot_minutes:")===0) {
      currentProfile.minSlot = parseInt(trimmed.split(":")[1].trim(),10);
    } else if (currentProfile && indent===4 && trimmed.indexOf("max_price_cents_kwh:")===0) {
      var mpVal = trimmed.split(":")[1].trim().split("#")[0].trim();
      currentProfile.maxPrice = mpVal==="null" ? null : (mpVal.toLowerCase()==="avg" ? "avg" : parseFloat(mpVal));
    } else if (currentProfile && indent===6 && trimmed.indexOf("- handler:")===0) {
      if (!currentProfile.handlers) currentProfile.handlers=[];
      currentProfile.handlers.push({name:trimmed.split(":")[1].trim().split("#")[0].trim(),enabled:true});
    } else if (currentProfile && currentProfile.handlers && currentProfile.handlers.length && indent===8 && trimmed.indexOf("enabled:")===0) {
      currentProfile.handlers[currentProfile.handlers.length-1].enabled = trimmed.split(":")[1].trim().indexOf("false")===-1;
    } else if (currentProfile && indent===4 && trimmed.indexOf("preferred_window_start:")===0) {
      currentProfile.defaultStart = trimmed.split(":").slice(1).join(":").trim().replace(/['"]/g,"").split("#")[0].trim();
    } else if (currentProfile && indent===4 && trimmed.indexOf("preferred_window_end:")===0) {
      currentProfile.defaultEnd = trimmed.split(":").slice(1).join(":").trim().replace(/['"]/g,"").split("#")[0].trim();
    } else if (currentProfile && indent===4 && trimmed.indexOf("schedule:")===0) {
      inSchedule=true;
    } else if (inSchedule && indent===6 && trimmed.indexOf("- days:")===0) {
      var daysStr = trimmed.split("days:")[1].trim().replace(/[\[\]]/g,"");
      currentEntry = {days:daysStr.split(",").map(function(d){return d.trim();}),start:null,end:null};
      currentProfile.schedule.push(currentEntry);
    } else if (inSchedule && currentEntry && indent===8) {
      if (trimmed.indexOf("preferred_window_start:")===0)
        currentEntry.start = trimmed.split(":").slice(1).join(":").trim().replace(/['"]/g,"").split("#")[0].trim();
      else if (trimmed.indexOf("preferred_window_end:")===0)
        currentEntry.end = trimmed.split(":").slice(1).join(":").trim().replace(/['"]/g,"").split("#")[0].trim();
      else if (trimmed.indexOf("required_hours:")===0)
        currentEntry.requiredHours = parseFloat(trimmed.split(":")[1].trim());
    } else if (indent<=2 && trimmed && trimmed[0]!=="#" && currentProfile && inSchedule) {
      if (trimmed.indexOf("-")!==0 && trimmed.indexOf("schedule:")!==0) inSchedule=false;
    }
  }
  return profiles.length ? {profiles:profiles} : null;
}

// ── Data loading ──────────────────────────────────────────────────────────
var FALLBACK_PLAN_NAMES = ["topup","overnight","optimal"];

function fetchWithTimeout(url, ms) {
  ms = ms||4000;
  var ctrl = new AbortController();
  var id = setTimeout(function(){ctrl.abort();},ms);
  return fetch(url,{signal:ctrl.signal}).then(function(r){clearTimeout(id);return r;}).catch(function(e){clearTimeout(id);throw e;});
}

function loadFromRepo() {
  var configText = null, names = FALLBACK_PLAN_NAMES;
  fetchWithTimeout("config.yaml?t="+Date.now()).then(function(r){
    if(!r.ok) throw new Error("no config");
    return r.text();
  }).then(function(text){
    configText = text;
    var parsed = parseConfigYaml(text);
    if(parsed) names = parsed.profiles.map(function(p){return p.name;});
  }).catch(function(){}).finally(function(){
    Promise.all(names.map(function(name){
      return fetchWithTimeout("data/plan-"+name+".json?t="+Date.now())
        .then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});
    })).then(function(results){
      var plans = results.filter(function(p){return p!==null;});
      if(!plans.length){ document.getElementById("run-time").textContent="no plan data found"; return; }

      plans.forEach(function(p){PLAN_DATA[p.profile]=p;});
      var latest = plans.reduce(function(a,b){return a.date>b.date?a:b;});
      var runEl  = document.getElementById("run-time");
      runEl.textContent = "created "+latest.date;
      var planDate = new Date(latest.date+"T00:00:00Z");
      var today = new Date(); today.setUTCHours(0,0,0,0);
      var age = Math.floor((today-planDate)/86400000);
      if(age>1) {
        var w=document.createElement("div"); w.className="warn-banner";
        w.textContent="\u26a0 plan data is "+age+" days old \u2014 prices may not have been available yet";
        document.querySelector(".shell").insertBefore(w,document.getElementById("profiles"));
      }
      if(plans.some(function(p){return p.price_source==="forecast";})) {
        var fw=document.createElement("div"); fw.className="warn-banner";
        fw.textContent="\u26a0 prices sourced from forecast \u2014 real-time data was unavailable";
        document.querySelector(".shell").insertBefore(fw,document.getElementById("profiles"));
      }
      renderProfiles(plans);
      if(configText){
        var parsed=parseConfigYaml(configText);
        if(parsed) parsed.profiles.forEach(function(p){PROFILE_CONFIG[p.name]=p;});
      }
    });
  });
}

loadFromRepo();
</script>

name: Charging Planner

on:
  schedule:
    - cron: '30 12 * * *'   # 12:30 UTC = 15:30 EEST (summer) / 14:30 EET (winter)
                            # One run covers both DST states. Prices publish ~12:00 UTC
                            # so this always lands after publication.
  workflow_dispatch:

jobs:
  plan:
    name: Build charging plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Write config
        run: |
          cat > config.yaml << 'YAML'
          entsoe:
            api_key: "${{ secrets.ENTSOE_API_KEY }}"
            area: "FI"
          charging:
            - name: "topup"
              required_hours: 2
              continuous_only: false
              min_slot_minutes: 30
              preferred_window_start: "00:00"
              preferred_window_end: "06:30"
              timezone: "Europe/Helsinki"
            - name: "overnight"
              required_hours: 6
              continuous_only: true
              min_slot_minutes: 30
              preferred_window_start: "22:00"
              preferred_window_end: "06:30"
              timezone: "Europe/Helsinki"
          YAML

      - name: Build plan
        id: plan
        run: |
          python charging_planner.py --output-dir . && {
            echo "prices_available=true" >> $GITHUB_OUTPUT
            echo "plan_date=$(python -c "import glob,json; f=sorted(glob.glob('plan-*.json'))[0]; print(json.load(open(f))['date'])")" >> $GITHUB_OUTPUT
            for f in plan-*.json; do echo "=== $f ===" && cat "$f"; done
          } || {
            echo "Prices not yet available or script error — skipping remaining steps."
          }

      - name: Upload plan artifact
        if: steps.plan.outputs.prices_available == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: charging-plan-${{ steps.plan.outputs.plan_date }}
          path: |
            plan-*.json
          retention-days: 2

      - name: Notify via ntfy
        if: steps.plan.outputs.prices_available == 'true'
        run: |
          python - << 'EOF'
          import glob, json, urllib.request

          # Load all profiles, sort by required_minutes ascending (shortest first)
          plans = sorted(
              [json.load(open(f)) for f in glob.glob("plan-*.json")],
              key=lambda p: p["required_minutes"],
          )
          date = plans[0]["date"]

          def hm(s):
              h, m = map(int, s.split(":"))
              return h * 60 + m

          def make_ruler(plan, chars=20):
              wins      = plan["windows"]
              pw_start  = plan["preferred_window_start"]
              pw_end    = plan["preferred_window_end"]
              pw_s      = hm(pw_start)
              pw_e_raw  = hm(pw_end) if pw_end != "24:00" else 24 * 60
              overnight = pw_s > pw_e_raw   # e.g. 22:00–06:30
              # For overnight windows, shift end into the next-day number line
              # so all arithmetic stays positive and monotone.
              DAY = 24 * 60
              pw_e = pw_e_raw + DAY if overnight else pw_e_raw

              def win_end_min(w):
                  """Return window end in minutes, shifted +DAY for overnight windows."""
                  e = hm(w["end"]) if w["end"] != "00:00" else DAY
                  # A window end that is <= its start is a next-day time
                  s = hm(w["start"])
                  return e + DAY if overnight and e <= s else e

              # Span: preferred window expanded to cover any spill windows
              r_start = pw_s
              r_end   = pw_e
              for w in wins:
                  r_start = min(r_start, hm(w["start"]))
                  r_end   = max(r_end, win_end_min(w))
              r_start = (r_start // 60) * 60
              r_end   = ((r_end + 59) // 60) * 60

              # Compute bucket size from the unpadded span, then add one bucket
              # of padding on each side for context.
              span    = r_end - r_start
              bucket  = max(15, (span + chars - 1) // chars)
              bucket  = ((bucket + 14) // 15) * 15
              if overnight:
                  r_start = max(0, r_start - bucket)
                  r_end   = min(pw_s + DAY, r_end + bucket)
              else:
                  r_start = max(0, r_start - bucket)
                  r_end   = min(DAY, r_end + bucket)
              r_start = (r_start // 60) * 60
              r_end   = ((r_end + 59) // 60) * 60
              span    = r_end - r_start
              n_chars = span // bucket

              def in_window(slot_min):
                  if overnight:
                      return slot_min >= pw_s or slot_min < pw_e_raw
                  return pw_s <= slot_min < pw_e

              ruler = []
              for i in range(n_chars):
                  slot_min = (r_start + i * bucket) % DAY
                  ruler.append("▒" if in_window(slot_min) else "░")
              for w in wins:
                  s_idx = (hm(w["start"]) - r_start) // bucket
                  e_idx = (win_end_min(w) - r_start) // bucket
                  for i in range(max(0, s_idx), min(e_idx, n_chars)):
                      ruler[i] = "█"

              # Labels: wrap modulo DAY so e.g. 1560 min shows as 02:00
              def fmt_min(m):
                  m = m % DAY
                  return f"{m // 60:02d}:00"
              return f"{fmt_min(r_start)} {''.join(ruler)} {fmt_min(r_end)}"

          sections = []
          for plan in plans:
              profile   = plan.get("profile", "default")
              wins      = plan["windows"]
              pw_s      = hm(plan["preferred_window_start"])
              pw_e_raw  = hm(plan["preferred_window_end"]) if plan["preferred_window_end"] != "24:00" else 24 * 60
              overnight = pw_s > pw_e_raw

              def outside_window(w):
                  ws, we = hm(w["start"]), hm(w["end"]) if w["end"] != "00:00" else 24 * 60
                  if overnight:
                      # Inside if start >= pw_s OR end <= pw_e_raw
                      return not (ws >= pw_s or we <= pw_e_raw)
                  return ws >= pw_e_raw or we <= pw_s

              if wins:
                  win_lines = "\n".join(
                      f"{w['start']}–{w['end']}  {w['avg_price_cents_kwh']:.2f} c€/kWh"
                      + (" ⚡ merged" if w.get("gap_merged") else "")
                      + (" ⚠️ outside window" if outside_window(w) else "")
                      for w in wins
                  )
              else:
                  win_lines = "No windows selected"

              req = plan["required_minutes"]
              tot = plan["total_minutes"]
              def fmt_h(m):
                  return f"{m // 60}h" if m % 60 == 0 else f"{m // 60}h{m % 60:02d}m"
              summary = f"{fmt_h(tot)}/{fmt_h(req)}" + (" ⚠️" if tot < req else "")
              sections.append(f"{profile}  {summary}\n{win_lines}\n{make_ruler(plan)}")

          message = "\n\n".join(sections)

          req = urllib.request.Request(
              "https://ntfy.sh/entsoe-charging-f7x3k2",
              data=message.encode(),
              method="POST",
              headers={
                  "Title": f"Charging plan for {date}",
                  "Priority": "default",
                  "Tags": "electric_plug",
              },
          )
          urllib.request.urlopen(req, timeout=10)
          EOF

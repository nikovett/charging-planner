name: ENTSO-E Charging Plan

on:
  schedule:
    - cron: '30 11 * * *'  # 14:30 EEST (summer, UTC+3)
    - cron: '30 12 * * *'  # 14:30 EET  (winter, UTC+2)
  workflow_dispatch:

jobs:
  plan:
    name: Build charging plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Write config
        run: |
          cat > config.yaml << 'YAML'
          entsoe:
            api_key: "${{ secrets.ENTSOE_API_KEY }}"
            area: "FI"
          charging:
            required_hours: 2
            min_slot_minutes: 30
            preferred_window_start: "00:00"
            preferred_window_end: "07:00"
            timezone: "Europe/Helsinki"
          YAML

      - name: Build plan
        id: plan
        run: |
          python entsoe_prices.py --plan plan.json
          echo "plan_date=$(python -c "import json; print(json.load(open('plan.json'))['date'])")" >> $GITHUB_OUTPUT
          echo "=== plan.json ===" && cat plan.json

      - name: Upload plan artifact
        uses: actions/upload-artifact@v6
        with:
          name: charging-plan-${{ steps.plan.outputs.plan_date }}
          path: |
            plan.json
            chart.svg
          retention-days: 2

      - name: Notify via ntfy
        run: |
          python - << 'EOF'
          import json, urllib.request

          plan = json.load(open("plan.json"))
          date = plan["date"]
          avg  = plan["avg_price_cents_kwh"]
          tot  = plan["total_minutes"]
          wins = plan["windows"]

          # Determine ruler bounds — start from preferred window then expand
          # to encompass any slots that fell outside it (e.g. due to price cap)
          pw_start = plan.get("preferred_window_start") or "00:00"
          pw_end   = plan.get("preferred_window_end")   or "24:00"

          def hm(s):
              h, m = map(int, s.split(":"))
              return h * 60 + m

          ruler_start_min = hm(pw_start)
          ruler_end_min   = hm(pw_end) if pw_end != "24:00" else 24 * 60

          # Expand bounds to cover any window outside the preferred window
          for w in wins:
              ruler_start_min = min(ruler_start_min, hm(w["start"]))
              ruler_end_min   = max(ruler_end_min,   hm(w["end"]) if w["end"] != "00:00" else 24 * 60)
          # Snap to hour boundaries for clean labels
          ruler_start_min = (ruler_start_min // 60) * 60
          ruler_end_min   = ((ruler_end_min + 59) // 60) * 60
          ruler_span_min  = ruler_end_min - ruler_start_min

          # Each char = 15 min; fit into 24 chars (mobile-safe width)
          chars  = 24
          bucket = max(15, (ruler_span_min + chars - 1) // chars)
          bucket = ((bucket + 14) // 15) * 15
          n_chars = ruler_span_min // bucket

          # Mark preferred window region with a different shade
          pw_s = hm(pw_start)
          pw_e = hm(pw_end) if pw_end != "24:00" else 24 * 60
          ruler = []
          for i in range(n_chars):
              slot_min = ruler_start_min + i * bucket
              if pw_s <= slot_min < pw_e:
                  ruler.append("▒")   # preferred window, unscheduled
              else:
                  ruler.append("░")   # outside preferred window, unscheduled
          for w in wins:
              s_idx = (hm(w["start"]) - ruler_start_min) // bucket
              e_idx = (hm(w["end"])   - ruler_start_min) // bucket if w["end"] != "00:00" else n_chars
              for i in range(max(0, s_idx), min(e_idx, n_chars)):
                  ruler[i] = "█"
          ruler_str = "".join(ruler)

          # Labels: show start + end always; midpoint only if there's room
          mid_min = (ruler_start_min + ruler_end_min) // 2
          mid_h, mid_m = divmod(mid_min, 60)
          mid_label   = f"{mid_h:02d}:{mid_m:02d}"
          start_label = f"{ruler_start_min // 60:02d}:00"
          end_label   = f"{ruler_end_min // 60:02d}:00" if ruler_end_min < 24*60 else "24:00"
          min_width_for_mid = len(start_label) + len(mid_label) + len(end_label) + 2
          if n_chars >= min_width_for_mid:
              pad = (n_chars - len(mid_label)) // 2
              labels = (
                  f"{start_label}"
                  f"{' ' * (pad - len(start_label))}"
                  f"{mid_label}"
                  f"{' ' * (n_chars - pad - len(mid_label) - len(end_label))}"
                  f"{end_label}"
              )
          else:
              gap = n_chars - len(start_label) - len(end_label)
              labels = f"{start_label}{' ' * max(1, gap)}{end_label}"

          if wins:
              lines = "\n".join(
                  f"{w['start']}–{w['end']}  {w['avg_price_cents_kwh']:.2f} c€/kWh"
                  + (" ⚡ merged" if w.get("gap_merged") else "")
                  + (" ⚠️ outside window" if (
                      pw_start and pw_end and
                      (hm(w["start"]) >= pw_e or hm(w["end"]) <= pw_s)
                  ) else "")
                  for w in wins
              )
          else:
              lines = "No windows selected"

          message = (
              f"{date}  ·  {tot} min  ·  avg {avg:.2f} c€/kWh\n\n"
              f"{start_label} {ruler_str} {end_label}\n\n"
              f"{lines}"
          )

          req = urllib.request.Request(
              "https://ntfy.sh/entsoe-charging-f7x3k2",
              data=message.encode(),
              method="POST",
              headers={
                  "Title": f"Charging plan {date}",
                  "Priority": "default",
                  "Tags": "electric_plug",
              },
          )
          urllib.request.urlopen(req, timeout=10)
          EOF

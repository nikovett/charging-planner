name: Charging Planner

on:
  schedule:
    - cron: '30 12 * * *'   # 12:30 UTC = 15:30 EEST (summer) / 14:30 EET (winter)
                            # One run covers both DST states. Prices publish ~12:00 UTC
                            # so this always lands after publication.
  workflow_dispatch:

jobs:
  plan:
    name: Build charging plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Build plan
        id: plan
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python charging_planner.py --output-dir .

      - name: Deliver to Charge Amps
        if: steps.plan.outputs.prices_available == 'true'
        env:
          CHARGEAMPS_EMAIL:        ${{ secrets.CHARGEAMPS_EMAIL }}
          CHARGEAMPS_PASSWORD:     ${{ secrets.CHARGEAMPS_PASSWORD }}
          CHARGEAMPS_CP_TOPUP:     ${{ secrets.CHARGEAMPS_CP_TOPUP }}
          CHARGEAMPS_CP_OVERNIGHT: ${{ secrets.CHARGEAMPS_CP_OVERNIGHT }}
        run: python charger/deliver_chargeamps.py plan-*.json --config charger/charger.yaml

      - name: Upload plan artifact
        if: steps.plan.outputs.prices_available == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: charging-plan-${{ steps.plan.outputs.plan_date }}
          path: plan-*.json
          retention-days: 2

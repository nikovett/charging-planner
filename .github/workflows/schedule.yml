name: ENTSO-E Charging Plan

on:
  schedule:
    - cron: '0 12 * * *'   # 12:00 UTC = 15:00 EEST (summer) / 14:00 EET (winter)
                            # One run covers both DST states. Prices publish ~13:00 CET
                            # so this always lands after publication.
  workflow_dispatch:

jobs:
  plan:
    name: Build charging plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Write config
        run: |
          cat > config.yaml << 'YAML'
          entsoe:
            api_key: "${{ secrets.ENTSOE_API_KEY }}"
            area: "FI"
          charging:
            required_hours: 2
            min_slot_minutes: 30
            preferred_window_start: "00:00"
            preferred_window_end: "07:00"
            timezone: "Europe/Helsinki"
          YAML

      - name: Build plan
        id: plan
        run: |
          python entsoe_prices.py --plan plan.json && {
            echo "prices_available=true" >> $GITHUB_OUTPUT
            echo "plan_date=$(python -c "import json; print(json.load(open('plan.json'))['date'])")" >> $GITHUB_OUTPUT
            echo "=== plan.json ===" && cat plan.json
          } || {
            echo "Prices not yet available or script error — skipping remaining steps."
          }

      - name: Upload plan artifact
        if: steps.plan.outputs.prices_available == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: charging-plan-${{ steps.plan.outputs.plan_date }}
          path: |
            plan.json
            chart.svg
          retention-days: 2

      - name: Notify via ntfy
        if: steps.plan.outputs.prices_available == 'true'
        run: |
          python - << 'EOF'
          import json, urllib.request

          plan  = json.load(open("plan.json"))
          date  = plan["date"]
          avg   = plan["avg_price_cents_kwh"]
          tot   = plan["total_minutes"]
          wins  = plan["windows"]

          chars   = 24
          pw_start = plan["preferred_window_start"]
          pw_end   = plan["preferred_window_end"]

          def hm(s):
              h, m = map(int, s.split(":"))
              return h * 60 + m

          pw_s = hm(pw_start)
          pw_e = hm(pw_end) if pw_end != "24:00" else 24 * 60

          ruler_start_min = hm(pw_start)
          ruler_end_min   = hm(pw_end) if pw_end != "24:00" else 24 * 60

          for w in wins:
              ruler_start_min = min(ruler_start_min, hm(w["start"]))
              ruler_end_min   = max(ruler_end_min,
                                    hm(w["end"]) if w["end"] != "00:00" else 24 * 60)

          ruler_start_min = (ruler_start_min // 60) * 60
          ruler_end_min   = ((ruler_end_min + 59) // 60) * 60

          _span   = ruler_end_min - ruler_start_min
          _bucket = max(15, (_span + chars - 1) // chars)
          _bucket = ((_bucket + 14) // 15) * 15
          ruler_start_min = max(0,       ruler_start_min - _bucket)
          ruler_end_min   = min(24 * 60, ruler_end_min   + _bucket)
          ruler_start_min = (ruler_start_min // 60) * 60
          ruler_end_min   = ((ruler_end_min + 59) // 60) * 60
          ruler_span_min  = ruler_end_min - ruler_start_min

          bucket  = max(15, (ruler_span_min + chars - 1) // chars)
          bucket  = ((bucket + 14) // 15) * 15
          n_chars = ruler_span_min // bucket

          ruler = []
          for i in range(n_chars):
              slot_min = ruler_start_min + i * bucket
              ruler.append("▒" if pw_s <= slot_min < pw_e else "░")
          for w in wins:
              s_idx = (hm(w["start"]) - ruler_start_min) // bucket
              e_idx = ((hm(w["end"]) if w["end"] != "00:00" else 24 * 60)
                       - ruler_start_min) // bucket
              for i in range(max(0, s_idx), min(e_idx, n_chars)):
                  ruler[i] = "█"
          ruler_str = "".join(ruler)

          start_label = f"{ruler_start_min // 60:02d}:00"
          end_label   = f"{ruler_end_min // 60:02d}:00" if ruler_end_min < 24 * 60 else "24:00"

          if wins:
              lines = "\n".join(
                  f"{w['start']}–{w['end']}  {w['avg_price_cents_kwh']:.2f} c€/kWh"
                  + (" ⚡ merged" if w.get("gap_merged") else "")
                  + (" ⚠️ outside window" if (
                      hm(w["start"]) >= pw_e or hm(w["end"]) <= pw_s
                  ) else "")
                  for w in wins
              )
          else:
              lines = "No windows selected"

          message = (
              f"{lines}\n\n"
              f"{start_label} {ruler_str} {end_label}"
          )

          req = urllib.request.Request(
              "https://ntfy.sh/entsoe-charging-f7x3k2",
              data=message.encode(),
              method="POST",
              headers={
                  "Title": f"Charging plan for {date}",
                  "Priority": "default",
                  "Tags": "electric_plug",
              },
          )
          urllib.request.urlopen(req, timeout=10)
          EOF

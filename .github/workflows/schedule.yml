name: Charging Planner

on:
  schedule:
    - cron: '00 11 * * *'   # 11:00 UTC = 14:00 EEST (summer) / 13:00 EET (winter)
                            # GHA consistently delays 30-60min, landing at ~14:30 EEST (summer).
                            # Prices publish at ~11:00 UTC so this always lands after (summer).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan:
    name: Build charging plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Build plan
        id: plan
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: python charging_planner.py --output-dir .

      - name: Deliver to charger(s)
        if: steps.plan.outputs.prices_available == 'true'
        env:
          # Charge Amps credentials (used by deliver_chargeamps.py)
          CHARGER_USERNAME:    ${{ secrets.CHARGER_USERNAME }}
          CHARGER_PASSWORD: ${{ secrets.CHARGER_PASSWORD }}
          # Charger IDs — shared across all handlers; add more as needed
          CHARGER_ID_1:     ${{ secrets.CHARGER_ID_1 }}
          CHARGER_ID_2:     ${{ secrets.CHARGER_ID_2 }}
        run: python delivery/deliver.py plan-*.json --config config.yaml

      - name: Publish plans to data/ for dashboard
        if: always() && steps.plan.outputs.prices_available == 'true'
        run: |
          mkdir -p data
          cp plan-*.json data/
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: update plan data [skip ci]"
          git push

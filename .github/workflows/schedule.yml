name: Charging Planner

on:
  schedule:
    - cron: '30 12 * * *'   # 12:30 UTC = 15:30 EEST (summer) / 14:30 EET (winter)
                            # One run covers both DST states. Prices publish ~12:00 UTC
                            # so this always lands after publication.
  workflow_dispatch:

jobs:
  plan:
    name: Build charging plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Build plan
        id: plan
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python charging_planner.py --output-dir . && {
            echo "prices_available=true" >> $GITHUB_OUTPUT
            echo "plan_date=$(python -c "import glob,json; f=sorted(glob.glob('plan-*.json'))[0]; print(json.load(open(f))['date'])")" >> $GITHUB_OUTPUT
            for f in plan-*.json; do echo "=== $f ===" && cat "$f"; done
          } || {
            echo "Prices not yet available or script error — skipping remaining steps."
          }

      - name: Upload plan artifact
        if: steps.plan.outputs.prices_available == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: charging-plan-${{ steps.plan.outputs.plan_date }}
          path: plan-*.json
          retention-days: 2

name: ENTSO-E Charging Plan

on:
  schedule:
    - cron: '30 11 * * *'  # 14:30 EEST (summer, UTC+3)
    - cron: '30 12 * * *'  # 14:30 EET  (winter, UTC+2)
  workflow_dispatch:

jobs:
  plan:
    name: Build charging plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Write config
        run: |
          cat > config.yaml << 'YAML'
          entsoe:
            api_key: "${{ secrets.ENTSOE_API_KEY }}"
            area: "FI"
          charging:
            required_hours: 4
            min_slot_minutes: 30
            schedule_next_day: true
            preferred_window_start: "00:00"
            preferred_window_end: "06:30"
            timezone: "Europe/Helsinki"
          YAML

      - name: Build plan
        id: plan
        run: |
          python entsoe_prices.py --plan plan.json
          echo "plan_date=$(python -c "import json; print(json.load(open('plan.json'))['date'])")" >> $GITHUB_OUTPUT

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: charging-plan-${{ steps.plan.outputs.plan_date }}
          path: plan.json
          retention-days: 2

name: Charging Planner

on:
  schedule:
    - cron: '30 12 * * *'   # 12:30 UTC = 15:30 EEST (summer) / 14:30 EET (winter)
                            # One run covers both DST states. Prices publish ~12:00 UTC
                            # so this always lands after publication.
  workflow_dispatch:

jobs:
  plan:
    name: Build charging plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Build plan
        id: plan
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python charging_planner.py --output-dir .

      - name: Deliver to charger(s)
        if: steps.plan.outputs.prices_available == 'true'
        env:
          # Charge Amps credentials (used by deliver_chargeamps.py)
          CHARGER_EMAIL:    ${{ secrets.CHARGER_EMAIL }}
          CHARGER_PASSWORD: ${{ secrets.CHARGER_PASSWORD }}
          # Charger IDs — shared across all handlers; add more as needed
          CHARGER_ID_1:     ${{ secrets.CHARGER_ID_1 }}
          CHARGER_ID_2:     ${{ secrets.CHARGER_ID_2 }}
          # OCPP endpoint URL (used by deliver_ocpp.py)
          OCPP_ENDPOINT_URL: ${{ secrets.OCPP_ENDPOINT_URL }}
        run: python charger/deliver.py plan-*.json --config config.yaml

      - name: Upload plan artifact
        if: steps.plan.outputs.prices_available == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: charging-plan-${{ steps.plan.outputs.plan_date }}
          path: plan-*.json
          retention-days: 2
